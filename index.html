<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Royal Ludo Offline</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#101827;
  color:white;
}

button{
  font-family:inherit;
  cursor:pointer;
  border:0;
}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.hidden{
  display:none!important;
}

/* HOME */

.home{
  width:min(1100px,100%);
  min-height:650px;
  border-radius:30px;
  padding:35px;
  background:
    radial-gradient(circle at 20% 20%,#55c7ff55,transparent 30%),
    radial-gradient(circle at 80% 80%,#ffcf4d55,transparent 30%),
    linear-gradient(145deg,#17365e,#381b58);
  box-shadow:0 25px 80px #0008;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.crown{
  font-size:70px;
}

.logo{
  font-size:clamp(45px,8vw,90px);
  font-weight:1000;
  letter-spacing:3px;
  color:#ffd52a;
  text-shadow:
    0 6px 0 #9c5d00,
    0 10px 25px #0009;
}

.subtitle{
  font-size:20px;
  opacity:.9;
  margin-bottom:40px;
}

.homeTokens{
  display:flex;
  justify-content:center;
  gap:45px;
  margin:20px 0 50px;
}

.bigToken{
  width:75px;
  height:95px;
  border-radius:50% 50% 42% 42%;
  box-shadow:
    inset 8px 8px 10px #ffffff66,
    inset -8px -10px 12px #0005,
    0 12px 20px #0008;
}

.red{background:#ed263b}
.green{background:#21c95b}
.yellow{background:#ffd22e}
.blue{background:#298cff}

.mainBtn{
  padding:18px 55px;
  border-radius:50px;
  background:linear-gradient(#ffe85a,#ffae00);
  color:#321c00;
  font-size:24px;
  font-weight:900;
  box-shadow:0 8px 0 #a86500,0 15px 30px #0007;
}

.mainBtn:active{
  transform:translateY(5px);
  box-shadow:0 3px 0 #a86500;
}

.offline{
  position:absolute;
  right:25px;
  top:25px;
  background:#153d8d;
  padding:10px 18px;
  border-radius:30px;
}

/* SETUP */

.setup{
  width:min(900px,100%);
  background:#f8f1d8;
  color:#252525;
  border-radius:30px;
  padding:30px;
  box-shadow:0 30px 80px #0009;
}

.setup h1{
  text-align:center;
  color:#d53a21;
  font-size:40px;
}

.sectionTitle{
  font-size:20px;
  font-weight:bold;
  margin:22px 0 12px;
}

.options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.option{
  padding:18px 10px;
  border-radius:16px;
  background:white;
  box-shadow:0 4px 12px #0002;
  font-weight:bold;
}

.option.active{
  outline:4px solid #267cff;
  background:#e8f2ff;
}

.tokenOptions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.tokenChoice{
  padding:15px;
  border-radius:15px;
  background:white;
  text-align:center;
  box-shadow:0 4px 12px #0002;
}

.tokenPreview{
  width:45px;
  height:55px;
  margin:auto;
  border-radius:50%;
}

.startGame{
  display:block;
  width:100%;
  margin-top:30px;
  padding:18px;
  border-radius:20px;
  background:#25c95b;
  color:white;
  font-size:24px;
  font-weight:900;
}

/* GAME */

.gameScreen{
  min-height:100vh;
  background:
    radial-gradient(circle at center,#273f27,#07100b);
  padding:10px;
  overflow:hidden;
}

.gameTop{
  width:min(1250px,100%);
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:8px;
}

.gameTitle{
  font-size:clamp(20px,4vw,35px);
  font-weight:900;
  color:#ffd53b;
}

.smallBtn{
  padding:10px 16px;
  border-radius:14px;
  background:#ffffff22;
  color:white;
  border:1px solid #ffffff44;
}

/* BOARD AREA */

.boardArea{
  width:min(1250px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:190px minmax(400px,700px) 190px;
  grid-template-rows:auto auto;
  gap:10px;
  align-items:center;
  justify-content:center;
}

.diceBox{
  width:170px;
  min-height:150px;
  border-radius:22px;
  padding:12px;
  background:#ffffff12;
  border:2px solid #ffffff22;
  text-align:center;
  box-shadow:0 10px 30px #0006;
}

.diceBox.active{
  animation:pulse 1s infinite;
  border-color:#ffe342;
  box-shadow:0 0 25px #ffe34288;
}

.diceName{
  font-weight:bold;
  margin-bottom:8px;
}

.dice{
  width:80px;
  height:80px;
  margin:auto;
  border-radius:16px;
  background:white;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  font-weight:900;
  box-shadow:0 8px 15px #0007;
}

.dice.roll{
  animation:roll .45s linear;
}

.rollBtn{
  margin-top:10px;
  padding:8px 15px;
  border-radius:12px;
  background:#ffd52c;
  font-weight:bold;
}

@keyframes pulse{
  50%{transform:scale(1.04)}
}

@keyframes roll{
  0%{transform:rotate(0) scale(1)}
  50%{transform:rotate(180deg) scale(1.15)}
  100%{transform:rotate(360deg) scale(1)}
}

/* LUDO BOARD */

.board{
  position:relative;
  width:min(88vw,700px);
  aspect-ratio:1;
  background:#fff;
  border:10px solid #3c250d;
  border-radius:12px;
  box-shadow:0 20px 60px #000b;
  overflow:visible;
  z-index:1;
}

/* four homes */

.homeArea{
  position:absolute;
  width:40%;
  height:40%;
  padding:7%;
  border:2px solid #ffffffaa;
}

.homeArea.redHome{
  left:0;
  top:0;
  background:#ed263b;
}

.homeArea.greenHome{
  right:0;
  top:0;
  background:#21c95b;
}

.homeArea.blueHome{
  left:0;
  bottom:0;
  background:#298cff;
}

.homeArea.yellowHome{
  right:0;
  bottom:0;
  background:#ffd22e;
}

.homeInner{
  width:100%;
  height:100%;
  background:white;
  border-radius:18px;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:10px;
  padding:12px;
}

.slot{
  border-radius:50%;
  background:#ddd;
  box-shadow:inset 0 3px 7px #0004;
}

/* PATH */

.path{
  position:absolute;
  left:30%;
  top:0;
  width:40%;
  height:100%;
  background:
    linear-gradient(to bottom,
      transparent 0 39%,
      #ddd 39% 61%,
      transparent 61%);
}

.pathH{
  position:absolute;
  top:30%;
  left:0;
  width:100%;
  height:40%;
  background:
    linear-gradient(to right,
      transparent 0 39%,
      #ddd 39% 61%,
      transparent 61%);
}

.cell{
  position:absolute;
  width:6.666%;
  height:6.666%;
  border:1px solid #7775;
  background:#fff;
}

/* center */

.center{
  position:absolute;
  left:40%;
  top:40%;
  width:20%;
  height:20%;
  background:conic-gradient(
    #21c95b 0 25%,
    #ffd22e 25% 50%,
    #298cff 50% 75%,
    #ed263b 75% 100%
  );
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  z-index:2;
}

/* TOKENS */

.token{
  position:absolute;
  width:6.2%;
  aspect-ratio:1;
  border-radius:50%;
  z-index:1000;
  border:3px solid white;
  box-shadow:
    inset 5px 5px 8px #ffffff88,
    inset -5px -7px 8px #0006,
    0 7px 12px #0009;
  transition:
    left .25s ease,
    top .25s ease,
    transform .15s ease;
  transform:translate(-50%,-50%);
}

.token:hover{
  transform:translate(-50%,-50%) scale(1.15);
}

.token.redToken{background:#ed263b}
.token.greenToken{background:#21c95b}
.token.blueToken{background:#298cff}
.token.yellowToken{background:#ffd22e}

.token.movable{
  animation:tokenPulse .8s infinite;
  cursor:pointer;
}

@keyframes tokenPulse{
  50%{
    transform:translate(-50%,-50%) scale(1.25);
    filter:brightness(1.3);
  }
}

/* STATUS */

.status{
  grid-column:2;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  min-height:35px;
}

.turnDot{
  display:inline-block;
  width:16px;
  height:16px;
  border-radius:50%;
  margin-right:7px;
}

/* WIN */

.winOverlay{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:5000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.winBox{
  width:min(550px,90%);
  text-align:center;
  padding:45px 25px;
  border-radius:30px;
  background:linear-gradient(145deg,#41217a,#1a397a);
  box-shadow:0 30px 100px #000;
}

.winBox h1{
  font-size:55px;
  color:#ffd43d;
}

.confetti{
  font-size:45px;
  margin:15px;
  animation:jump .8s infinite alternate;
}

@keyframes jump{
  to{transform:translateY(-15px) rotate(10deg)}
}

/* RESPONSIVE */

@media(max-width:850px){
  .boardArea{
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto auto;
  }

  .board{
    grid-column:1 / 3;
    grid-row:2;
    width:min(92vw,650px);
  }

  .status{
    grid-column:1 / 3;
    grid-row:3;
  }

  .diceBox{
    width:100%;
  }
}

@media(max-width:500px){
  .home{
    padding:22px 15px;
  }

  .homeTokens{
    gap:15px;
  }

  .bigToken{
    width:48px;
    height:65px;
  }

  .setup{
    padding:18px;
  }

  .options{
    grid-template-columns:1fr 1fr 1fr;
  }

  .tokenOptions{
    grid-template-columns:1fr 1fr;
  }

  .diceBox{
    min-height:120px;
  }

  .dice{
    width:60px;
    height:60px;
    font-size:36px;
  }
}
</style>
</head>

<script>

/* =========================================================
   OFFLINE LUDO
   सभी code इसी HTML के अंदर है
   ========================================================= */


/* ---------- GAME SETTINGS ---------- */

const COLORS = [
  "red",
  "green",
  "yellow",
  "blue"
];

const diceFaces = [
  "",
  "⚀",
  "⚁",
  "⚂",
  "⚃",
  "⚄",
  "⚅"
];

let humanPlayers = 2;
let aiPlayers = 2;
let selectedToken = "red";

let players = [];
let currentPlayer = 0;

let rolling = false;
let audioContext = null;


/* ---------- HOME ---------- */

function openSetup(){

  document
    .getElementById("homeScreen")
    .classList.add("hidden");

  document
    .getElementById("setupScreen")
    .classList.remove("hidden");
}


/* ---------- HUMAN COUNT ---------- */

document.querySelectorAll(".humanCount")
.forEach(button => {

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".humanCount")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    humanPlayers =
      Number(button.dataset.human);

    updateAIOptions();

  });

});


/* ---------- AI MODE ---------- */

document.querySelectorAll(".aiMode")
.forEach(button => {

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".aiMode")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    if(button.dataset.ai === "0"){

      aiPlayers = 0;

      document
        .getElementById("aiOptions")
        .classList.add("hidden");

    }else{

      document
        .getElementById("aiOptions")
        .classList.remove("hidden");

      updateAIOptions();
    }

  });

});


/* ---------- AI COUNT ---------- */

document.querySelectorAll(".aiCount")
.forEach(button => {

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".aiCount")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    aiPlayers =
      Number(button.dataset.aiCount);

    updateAIOptions();

  });

});


function updateAIOptions(){

  const maxAI =
    Math.min(3,4-humanPlayers);

  document
    .querySelectorAll(".aiCount")
    .forEach(button=>{

      const n =
        Number(button.dataset.aiCount);

      if(n <= maxAI){
        button.disabled=false;
        button.style.opacity="1";
      }else{
        button.disabled=true;
        button.style.opacity=".35";
      }

    });

  if(aiPlayers > maxAI){
    aiPlayers = maxAI;

    const btn =
      document.querySelector(
        `.aiCount[data-ai-count="${aiPlayers}"]`
      );

    if(btn){

      document
        .querySelectorAll(".aiCount")
        .forEach(x=>x.classList.remove("active"));

      btn.classList.add("active");
    }
  }
}


/* ---------- TOKEN SELECT ---------- */

document.querySelectorAll(".tokenChoice")
.forEach(button => {

  button.addEventListener("click",()=>{

    document
      .querySelectorAll(".tokenChoice")
      .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    selectedToken =
      button.dataset.token;

  });

});


/* ---------- AUDIO ---------- */

function initAudio(){

  if(!audioContext){

    audioContext =
      new (window.AudioContext ||
           window.webkitAudioContext)();

  }

  if(audioContext.state === "suspended"){
    audioContext.resume();
  }
}


function sound(freq=500,duration=.08){

  try{

    initAudio();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.frequency.value=freq;

    oscillator.type="square";

    gain.gain.setValueAtTime(
      .06,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime+duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(
      audioContext.currentTime+duration
    );

  }catch(e){}

}


function diceSound(){

  sound(180,.07);

  setTimeout(()=>{
    sound(260,.07);
  },80);

  setTimeout(()=>{
    sound(380,.1);
  },160);

}


function moveSound(){

  sound(650,.05);

}


/* ---------- START GAME ---------- */

function startGame(){

  initAudio();

  players=[];

  const total =
    humanPlayers + aiPlayers;

  let colorIndex=0;

  for(let i=0;i<total;i++){

    players.push({

      color:COLORS[colorIndex],

      ai:i >= humanPlayers,

      tokens:[
        {pos:-1},
        {pos:-1},
        {pos:-1},
        {pos:-1}
      ],

      finished:0

    });

    colorIndex++;

  }

  document
    .getElementById("setupScreen")
    .classList.add("hidden");

  document
    .getElementById("gameScreen")
    .classList.remove("hidden");

  setupDiceVisibility();

  resetTokens();

  currentPlayer=0;

  updateTurn();

}


/* ---------- DICE VISIBILITY ---------- */

function setupDiceVisibility(){

  COLORS.forEach(color=>{

    const box =
      document.getElementById(
        "dice-"+color
      );

    box.classList.add("hidden");

  });


  players.forEach(player=>{

    const box =
      document.getElementById(
        "dice-"+player.color
      );

    box.classList.remove("hidden");

  });

}


/* ---------- TOKEN HOME POSITIONS ---------- */

const homePositions={

  red:[
    [8,8],
    [18,8],
    [8,18],
    [18,18]
  ],

  green:[
    [82,8],
    [92,8],
    [82,18],
    [92,18]
  ],

  yellow:[
    [82,82],
    [92,82],
    [82,92],
    [92,92]
  ],

  blue:[
    [8,82],
    [18,82],
    [8,92],
    [18,92]
  ]

};


/* ---------- PATH ---------- */

/*
  सरल offline playable path.
  Board percentage coordinates.
*/

const path=[];

for(let i=0;i<52;i++){

  let x;
  let y;

  if(i<13){

    x=20+i*4.6;
    y=47;

  }else if(i<26){

    x=80;
    y=47+(i-13)*4.6;

  }else if(i<39){

    x=80-(i-26)*4.6;
    y=53;

  }else{

    x=20;
    y=53-(i-39)*4.6;

  }

  path.push([x,y]);

}


/* ---------- RESET TOKENS ---------- */

function resetTokens(){

  players.forEach(player=>{

    player.tokens.forEach((token,i)=>{

      placeToken(
        player.color,
        i,
        -1
      );

    });

  });

}


/* ---------- PLACE TOKEN ---------- */

function placeToken(color,index,pos){

  const element =
    document.getElementById(
      `token-${color}-${index}`
    );

  if(!element) return;


  if(pos === -1){

    const p =
      homePositions[color][index];

    element.style.left=p[0]+"%";
    element.style.top=p[1]+"%";

  }else{

    const p =
      path[pos % path.length];

    element.style.left=p[0]+"%";
    element.style.top=p[1]+"%";

  }

  /*
    हमेशा सबसे ऊपर।
  */

  element.style.zIndex=1000;

}


/* ---------- UPDATE TURN ---------- */

function updateTurn(){

  document
    .querySelectorAll(".diceBox")
    .forEach(x=>x.classList.remove("active"));

  const player =
    players[currentPlayer];

  const box =
    document.getElementById(
      "dice-"+player.color
    );

  box.classList.add("active");

  document
    .getElementById("status")
    .innerHTML =
      `<span class="turnDot ${player.color}"></span>
       ${player.ai ? "🤖 AI" : "👤 Human"}
       — ${player.color.toUpperCase()} की चाल`;

  if(player.ai){

    setTimeout(()=>{

      rollDice(player.color);

    },900);

  }

}


/* ---------- ROLL DICE ---------- */

function rollDice(color){

  if(rolling) return;

  const player =
    players[currentPlayer];

  if(player.color !== color) return;

  rolling=true;

  diceSound();

  const die =
    document.getElementById(
      "die-"+color
    );

  die.classList.remove("roll");

  void die.offsetWidth;

  die.classList.add("roll");

  let count=0;

  const animation =
    setInterval(()=>{

      const temp =
        Math.floor(Math.random()*6)+1;

      die.textContent =
        diceFaces[temp];

      count++;

      if(count>=8){

        clearInterval(animation);

        const result =
          Math.floor(Math.random()*6)+1;

        die.textContent =
          diceFaces[result];

        rolling=false;

        handleRoll(result);

      }

    },70);

}


/* ---------- HANDLE ROLL ---------- */

function handleRoll(number){

  const player =
    players[currentPlayer];

  /*
    6 पर home token बाहर।
  */

  let moved=false;

  if(number===6){

    const homeIndex =
      player.tokens.findIndex(
        t=>t.pos===-1
      );

    if(homeIndex!==-1){

      player.tokens[homeIndex].pos=0;

      placeToken(
        player.color,
        homeIndex,
        0
      );

      moveSound();

      moved=true;

    }

  }


  if(!moved){

    const movable =
      player.tokens.find(
        t=>t.pos>=0 &&
        t.pos<51
      );

    if(movable){

      const index =
        player.tokens.indexOf(movable);

      movable.pos += number;

      if(movable.pos>=51){

        movable.pos=51;

        player.finished++;

      }

      placeToken(
        player.color,
        index,
        movable.pos
      );

      moveSound();

      moved=true;

    }

  }


  /*
    अगर 6 नहीं आया तो next player।
  */

  if(number===6){

    setTimeout(()=>{

      updateTurn();

    },500);

  }else{

    setTimeout(()=>{

      nextPlayer();

    },700);

  }


  checkWinner();

}


/* ---------- NEXT PLAYER ---------- */

function nextPlayer(){

  currentPlayer++;

  if(currentPlayer>=players.length){
    currentPlayer=0;
  }

  updateTurn();

}


/* ---------- WINNER ---------- */

function checkWinner(){

  const player =
    players[currentPlayer];

  if(player.finished>=4){

    document
      .getElementById("winnerText")
      .textContent =
      `${player.color.toUpperCase()} PLAYER ने शानदार जीत हासिल की! 🎉`;

    document
      .getElementById("winOverlay")
      .classList.remove("hidden");

    celebrate();

  }

}


/* ---------- CELEBRATION ---------- */

function celebrate(){

  for(let i=0;i<12;i++){

    setTimeout(()=>{

      sound(
        400 + Math.random()*600,
        .12
      );

    },i*120);

  }

}


/* ---------- TOKEN CLICK ---------- */

document.addEventListener(
  "click",
  function(e){

    if(!e.target.classList.contains("token")){
      return;
    }

    /*
      गोटी हमेशा ऊपर रहेगी।
    */

    e.target.style.zIndex=2000;

  }
);


/* ---------- PREVENT PAGE ZOOM ---------- */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault()
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault()
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault()
);


/* ---------- INITIAL SETUP ---------- */

updateAIOptions();

</script>
