<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#101810">

<title>Royal Ludo - Offline</title>

<style>
/* =========================================================
   ROYAL LUDO
   SINGLE FILE OFFLINE GAME
   HTML + CSS + JAVASCRIPT
   ========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:
        radial-gradient(circle at 50% 0%,
        #314d32 0%,
        #162217 42%,
        #070b07 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
    touch-action:manipulation;
}

/* =========================================================
   START SCREEN
   ========================================================= */

#startScreen{
    min-height:100vh;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.startBox{
    width:min(520px,96vw);
    padding:28px;
    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(39,61,41,.98),
            rgba(10,17,11,.98)
        );

    border:2px solid rgba(255,216,62,.65);

    box-shadow:
        0 0 55px rgba(255,202,42,.13),
        inset 0 0 35px rgba(255,255,255,.025);

    text-align:center;
}

.ludoLogo{
    width:112px;
    height:112px;
    margin:0 auto 12px;

    border-radius:30px;

    background:
        conic-gradient(
            #ef233c 0deg 90deg,
            #27b94e 90deg 180deg,
            #ffd32a 180deg 270deg,
            #318df2 270deg 360deg
        );

    border:7px solid white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:52px;

    box-shadow:
        0 12px 30px rgba(0,0,0,.45);
}

.startTitle{
    margin:5px 0;
    font-size:clamp(30px,8vw,42px);
    font-weight:900;
    letter-spacing:1px;
}

.startSub{
    color:#cbd8cb;
    margin-bottom:22px;
}

.optionTitle{
    text-align:left;
    color:#ffd83d;
    font-size:15px;
    font-weight:900;
    margin:18px 0 9px;
}

.humanOptions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.humanBtn,
.styleBtn{
    border:1px solid rgba(255,255,255,.18);
    background:#19261b;
    color:#fff;

    border-radius:13px;
    padding:13px 5px;

    font-weight:900;
    cursor:pointer;

    transition:.15s;
}

.humanBtn.active,
.styleBtn.active{
    background:
        linear-gradient(#ffe45c,#ffb400);

    color:#111;
    border-color:#fff0a2;

    box-shadow:
        0 5px 14px rgba(255,190,0,.18);
}

.humanBtn:active,
.styleBtn:active,
.smallBtn:active,
.rollBtn:active,
.startGameBtn:active{
    transform:scale(.97);
}

.styleOptions{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
}

.styleBtn{
    font-size:24px;
    padding:10px 2px;
}

.startGameBtn{
    width:100%;
    margin-top:24px;
    padding:17px;

    border:0;
    border-radius:18px;

    background:
        linear-gradient(#ffe76a,#ffb600);

    color:#151515;

    font-size:22px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 9px 22px rgba(255,184,0,.25);
}

/* =========================================================
   GAME SCREEN
   ========================================================= */

#gameScreen{
    display:none;
    width:100%;
    min-height:100vh;
    min-height:100svh;

    padding:
        max(9px,env(safe-area-inset-top))
        max(9px,env(safe-area-inset-right))
        max(12px,env(safe-area-inset-bottom))
        max(9px,env(safe-area-inset-left));
}

.gameHeader{
    width:min(1050px,100%);
    margin:0 auto 10px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.gameTitle{
    font-size:clamp(22px,5vw,38px);
    font-weight:900;
}

.headerButtons{
    display:flex;
    gap:7px;
}

.smallBtn{
    border:1px solid rgba(255,255,255,.18);
    background:#1b291d;
    color:#fff;

    border-radius:11px;
    padding:9px 12px;

    font-weight:900;
    cursor:pointer;
}

/* =========================================================
   PLAYER PANELS
   ========================================================= */

.playerPanels{
    width:min(1050px,100%);
    margin:0 auto 12px;

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.playerCard{
    position:relative;

    min-height:102px;
    padding:10px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            rgba(32,45,34,.97),
            rgba(16,24,17,.97)
        );

    border:2px solid rgba(255,255,255,.08);

    transition:.2s;
}

.playerCard.active{
    border-color:#ffe052;

    box-shadow:
        0 0 20px rgba(255,215,60,.28);

    transform:translateY(-2px);
}

.playerCard.hiddenPlayer{
    display:none;
}

.playerName{
    display:flex;
    align-items:center;
    gap:7px;

    font-weight:900;
    font-size:14px;
}

.playerDot{
    width:14px;
    height:14px;
    border-radius:50%;
    display:inline-block;
    box-shadow:0 2px 4px rgba(0,0,0,.35);
}

.redDot{background:#ef233c;}
.greenDot{background:#35bd58;}
.yellowDot{background:#ffd32a;}
.blueDot{background:#318df2;}

.aiLabel{
    position:absolute;
    right:8px;
    top:8px;

    background:#7548ff;
    color:white;

    padding:3px 7px;
    border-radius:7px;

    font-size:10px;
    font-weight:900;
}

.cardDice{
    margin-top:8px;

    width:52px;
    height:52px;

    border-radius:13px;

    background:#fff;
    color:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;
    font-weight:900;

    box-shadow:
        0 5px 10px rgba(0,0,0,.25);
}

/* =========================================================
   BOARD
   ========================================================= */

.boardWrap{
    width:min(760px,100%);
    margin:0 auto;
}

.board{
    position:relative;

    width:100%;
    aspect-ratio:1/1;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #f7f1df,
            #dcd2b9
        );

    border:9px solid #5b351a;

    box-shadow:
        0 18px 50px rgba(0,0,0,.5),
        inset 0 0 0 3px #f5d98b;

    overflow:visible;
}

/* =========================================================
   HOME AREAS
   ========================================================= */

.home{
    position:absolute;

    width:29%;
    height:29%;

    padding:13px;

    border-radius:19px;

    z-index:2;
}

.home.red{
    left:1.5%;
    top:1.5%;
    background:#ef233c;
}

.home.green{
    right:1.5%;
    top:1.5%;
    background:#27b94e;
}

.home.yellow{
    right:1.5%;
    bottom:1.5%;
    background:#ffd32a;
}

.home.blue{
    left:1.5%;
    bottom:1.5%;
    background:#318df2;
}

.homeInner{
    width:100%;
    height:100%;

    border-radius:20px;

    background:#fff;

    padding:14px;

    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;

    gap:9px;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.18);
}

.baseSpot{
    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #fff 0%,
            #ddd 60%,
            #aaa 100%
        );

    border:2px solid rgba(0,0,0,.08);

    box-shadow:
        inset 0 3px 5px rgba(255,255,255,.8),
        0 3px 5px rgba(0,0,0,.2);
}

/* =========================================================
   FIXED TRACK
   ========================================================= */

.trackLayer{
    position:absolute;
    inset:0;
    z-index:4;
}

.trackCell{
    position:absolute;

    width:5.8%;
    aspect-ratio:1/1;

    transform:translate(-50%,-50%);

    border-radius:8px;

    background:#fffdf7;

    border:2px solid #aaa08e;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(11px,2.7vw,22px);

    box-shadow:
        0 2px 4px rgba(0,0,0,.16);

    z-index:4;
}

.trackCell.redStart{
    background:#ffc6cf;
}

.trackCell.greenStart{
    background:#c7f0ce;
}

.trackCell.yellowStart{
    background:#fff0a6;
}

.trackCell.blueStart{
    background:#c9e2ff;
}

.trackCell.safe{
    background:
        linear-gradient(
            145deg,
            #fff,
            #f7eebc
        );

    border-color:#d3a51c;

    box-shadow:
        0 0 0 2px rgba(255,207,39,.28),
        0 3px 5px rgba(0,0,0,.15);
}

.star{
    font-size:clamp(13px,3vw,23px);
}

/* =========================================================
   HOME LANES
   ========================================================= */

.laneLayer{
    position:absolute;
    inset:0;
    z-index:5;
}

.laneCell{
    position:absolute;

    width:5.8%;
    aspect-ratio:1/1;

    transform:translate(-50%,-50%);

    border-radius:8px;

    border:2px solid rgba(0,0,0,.13);

    box-shadow:
        0 2px 4px rgba(0,0,0,.12);

    z-index:5;
}

.lane-red{background:#ef233c;}
.lane-green{background:#27b94e;}
.lane-yellow{background:#ffd32a;}
.lane-blue{background:#318df2;}

/* =========================================================
   CENTER
   ========================================================= */

.centerHome{
    position:absolute;

    left:38%;
    top:38%;

    width:24%;
    height:24%;

    z-index:20;

    border:3px solid #9b917f;
    border-radius:13px;

    overflow:hidden;

    background:#ddd6c7;

    box-shadow:
        0 5px 12px rgba(0,0,0,.2);
}

.centerPart{
    position:absolute;
    width:50%;
    height:50%;
}

.centerRed{
    left:0;
    top:0;
    background:#ef233c;
    clip-path:polygon(0 0,100% 0,100% 100%);
}

.centerGreen{
    right:0;
    top:0;
    background:#27b94e;
    clip-path:polygon(0 0,100% 0,0 100%);
}

.centerYellow{
    right:0;
    bottom:0;
    background:#ffd32a;
    clip-path:polygon(100% 0,100% 100%,0 100%);
}

.centerBlue{
    left:0;
    bottom:0;
    background:#318df2;
    clip-path:polygon(0 0,100% 100%,0 100%);
}

.centerCrown{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:30;

    font-size:clamp(24px,7vw,48px);

    filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));
}

/* =========================================================
   TOKENS
   ========================================================= */

.tokenLayer{
    position:absolute;
    inset:0;
    z-index:100;
    pointer-events:none;
}

.token{
    position:absolute;

    width:7.8%;
    aspect-ratio:1/1;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:3px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100;

    pointer-events:auto;

    cursor:pointer;

    user-select:none;

    font-size:clamp(12px,3vw,24px);
    font-weight:900;

    box-shadow:
        0 6px 10px rgba(0,0,0,.45),
        inset 0 3px 6px rgba(255,255,255,.55);

    transition:
        left .13s linear,
        top .13s linear,
        transform .13s ease;
}

.token.red{
    background:
        radial-gradient(
            circle at 32% 25%,
            #ff9ca6,
            #ef233c 55%,
            #a80e25
        );
}

.token.green{
    background:
        radial-gradient(
            circle at 32% 25%,
            #b2f5be,
            #27b94e 55%,
            #126b2a
        );
}

.token.yellow{
    background:
        radial-gradient(
            circle at 32% 25%,
            #fffbc0,
            #ffd32a 55%,
            #c19800
        );
}

.token.blue{
    background:
        radial-gradient(
            circle at 32% 25%,
            #b5d9ff,
            #318df2 55%,
            #1253a2
        );
}

.token.movable{
    animation:
        tokenPulse .7s infinite alternate;

    box-shadow:
        0 0 0 4px #fff,
        0 0 22px rgba(255,222,49,.95),
        0 7px 11px rgba(0,0,0,.45);
}

@keyframes tokenPulse{
    from{
        transform:translate(-50%,-50%) scale(1);
    }

    to{
        transform:translate(-50%,-50%) scale(1.12);
    }
}

.token.selected{
    box-shadow:
        0 0 0 5px #fff,
        0 0 30px #ffe23c;
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls{
    width:min(760px,100%);

    margin:13px auto 0;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    flex-wrap:wrap;
}

.rollBtn{
    min-width:190px;
    min-height:62px;

    border:0;
    border-radius:18px;

    background:
        linear-gradient(#ffe96b,#ffb900);

    color:#171717;

    font-size:21px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 19px rgba(255,190,0,.28);
}

.rollBtn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.diceBig{
    width:68px;
    height:68px;

    border-radius:17px;

    background:#fff;
    color:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:43px;
    font-weight:900;

    box-shadow:
        0 6px 13px rgba(0,0,0,.3);
}

.diceBig.rolling{
    animation:diceRoll .45s linear;
}

@keyframes diceRoll{
    0%{transform:rotate(0) scale(1);}
    25%{transform:rotate(90deg) scale(1.08);}
    50%{transform:rotate(180deg) scale(.92);}
    75%{transform:rotate(270deg) scale(1.08);}
    100%{transform:rotate(360deg) scale(1);}
}

.status{
    width:min(760px,100%);

    margin:10px auto;

    min-height:28px;

    text-align:center;

    color:#f6f6f6;

    font-weight:900;
}

/* =========================================================
   WIN
   ========================================================= */

#winOverlay{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.84);

    z-index:9999;

    overflow:hidden;
}

.winBox{
    width:min(450px,90vw);

    padding:34px 24px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #293d2b,
            #101810
        );

    border:2px solid #ffe04b;

    box-shadow:
        0 0 70px rgba(255,215,60,.3);

    text-align:center;

    position:relative;
    z-index:5;
}

.winEmoji{
    font-size:76px;
}

.winBox h1{
    margin:5px 0;
    font-size:36px;
}

.winBox p{
    color:#d7dfd7;
}

.restartBtn{
    margin-top:18px;

    padding:15px 28px;

    border:0;
    border-radius:15px;

    background:
        linear-gradient(#ffe45d,#ffb600);

    color:#111;

    font-size:18px;
    font-weight:900;
}

/* =========================================================
   CONFETTI
   ========================================================= */

.confetti{
    position:absolute;

    top:-30px;

    font-size:24px;

    animation:
        confettiFall 3.2s linear forwards;

    z-index:2;
}

@keyframes confettiFall{
    to{
        top:110vh;
        transform:rotate(720deg);
    }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:700px){

    #gameScreen{
        padding:7px;
    }

    .playerPanels{
        grid-template-columns:repeat(2,1fr);
    }

    .playerCard{
        min-height:84px;
    }

    .cardDice{
        width:44px;
        height:44px;
        font-size:27px;
    }

    .home{
        padding:9px;
    }

    .homeInner{
        padding:9px;
        gap:5px;
    }

    .board{
        border-width:6px;
    }
}

@media(max-width:430px){

    .startBox{
        padding:20px 15px;
    }

    .humanBtn{
        padding:11px 3px;
        font-size:12px;
    }

    .playerName{
        font-size:12px;
    }

    .rollBtn{
        min-width:170px;
    }

    .smallBtn{
        padding:8px 9px;
    }

    .gameTitle{
        font-size:22px;
    }
}
</style>
</head>

<body>

<!-- =========================================================
     START SCREEN
     ========================================================= -->

<section id="startScreen">

<div class="startBox">

    <div class="ludoLogo">🎲</div>

    <div class="startTitle">
        ROYAL LUDO
    </div>

    <div class="startSub">
        ऑफलाइन • AI • 2–4 खिलाड़ी
    </div>

    <div class="optionTitle">
        कितने इंसान खेलेंगे?
    </div>

    <div class="humanOptions">

        <button class="humanBtn active" data-human="1">
            1 मानव
        </button>

        <button class="humanBtn" data-human="2">
            2 मानव
        </button>

        <button class="humanBtn" data-human="3">
            3 मानव
        </button>

        <button class="humanBtn" data-human="4">
            4 मानव
        </button>

    </div>

    <div class="optionTitle">
        गोटी का स्टाइल
    </div>

    <div class="styleOptions">

        <button class="styleBtn active" data-style="classic">
            ●
        </button>

        <button class="styleBtn" data-style="crown">
            ♛
        </button>

        <button class="styleBtn" data-style="star">
            ★
        </button>

        <button class="styleBtn" data-style="gem">
            ◆
        </button>

        <button class="styleBtn" data-style="smile">
            ☺
        </button>

    </div>

    <button id="startBtn" class="startGameBtn">
        🎮 GAME START
    </button>

</div>

</section>


<!-- =========================================================
     GAME SCREEN
     ========================================================= -->

<section id="gameScreen">

<div class="gameHeader">

    <div class="gameTitle">
        🎲 ROYAL LUDO
    </div>

    <div class="headerButtons">

        <button class="smallBtn" id="fullscreenBtn">
            ⛶
        </button>

        <button class="smallBtn" id="newGameBtn">
            नया गेम
        </button>

    </div>

</div>


<!-- =========================================================
     PLAYER PANELS
     ========================================================= -->

<div class="playerPanels" id="playerPanels">

    <div class="playerCard" id="card0">

        <div class="playerName">
            <span class="playerDot redDot"></span>
            PLAYER 1
        </div>

        <div class="cardDice" id="cardDice0">
            ⚀
        </div>

    </div>


    <div class="playerCard" id="card1">

        <div class="playerName">
            <span class="playerDot greenDot"></span>
            PLAYER 2
        </div>

        <div class="cardDice" id="cardDice1">
            ⚀
        </div>

    </div>


    <div class="playerCard" id="card2">

        <div class="playerName">
            <span class="playerDot yellowDot"></span>
            PLAYER 3
        </div>

        <div class="cardDice" id="cardDice2">
            ⚀
        </div>

    </div>


    <div class="playerCard" id="card3">

        <div class="playerName">
            <span class="playerDot blueDot"></span>
            PLAYER 4
        </div>

        <div class="cardDice" id="cardDice3">
            ⚀
        </div>

    </div>

</div>


<!-- =========================================================
     BOARD
     ========================================================= -->

<div class="boardWrap">

<div class="board" id="board">


<!-- RED HOME -->

<div class="home red">

    <div class="homeInner">

        <div class="baseSpot" id="base-red-0"></div>
        <div class="baseSpot" id="base-red-1"></div>
        <div class="baseSpot" id="base-red-2"></div>
        <div class="baseSpot" id="base-red-3"></div>

    </div>

</div>


<!-- GREEN HOME -->

<div class="home green">

    <div class="homeInner">

        <div class="baseSpot" id="base-green-0"></div>
        <div class="baseSpot" id="base-green-1"></div>
        <div class="baseSpot" id="base-green-2"></div>
        <div class="baseSpot" id="base-green-3"></div>

    </div>

</div>


<!-- YELLOW HOME -->

<div class="home yellow">

    <div class="homeInner">

        <div class="baseSpot" id="base-yellow-0"></div>
        <div class="baseSpot" id="base-yellow-1"></div>
        <div class="baseSpot" id="base-yellow-2"></div>
        <div class="baseSpot" id="base-yellow-3"></div>

    </div>

</div>


<!-- BLUE HOME -->

<div class="home blue">

    <div class="homeInner">

        <div class="baseSpot" id="base-blue-0"></div>
        <div class="baseSpot" id="base-blue-1"></div>
        <div class="baseSpot" id="base-blue-2"></div>
        <div class="baseSpot" id="base-blue-3"></div>

    </div>

</div>


<!-- TRACK -->

<div id="trackLayer" class="trackLayer"></div>


<!-- HOME LANES -->

<div id="laneLayer" class="laneLayer"></div>


<!-- CENTER -->

<div class="centerHome">

    <div class="centerPart centerRed"></div>
    <div class="centerPart centerGreen"></div>
    <div class="centerPart centerYellow"></div>
    <div class="centerPart centerBlue"></div>

    <div class="centerCrown">
        🏆
    </div>

</div>


<!-- TOKENS -->

<div id="tokenLayer" class="tokenLayer"></div>

</div>

</div>


<!-- =========================================================
     CONTROLS
     ========================================================= -->

<div class="controls">

<script>

const HOME_POSITIONS = {

/* =========================================================

   ========================================================= */

function initAudio(){

    if(audioContext){
        return;
    }

    try{

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

    }catch(e){

        audioContext = null;

    }

}


function beep(
    frequency,
    duration,
    type="sine",
    volume=.05
){

    if(!audioContext){
        return;
    }

    try{

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = type;

        oscillator.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + duration
        );

    }catch(e){}

}


function soundDice(){

    beep(180,.06,"square",.045);

/* =========================================================
   TOKEN POSITION
   ========================================================= */

function getTrackPosition(
    playerIndex,
    progress
){

    const globalIndex =
        (
            START_INDEX[playerIndex] +
            progress
        ) % TRACK.length;

    return TRACK[globalIndex];
}


function getTokenPosition(token){

    const player =
        players[token.playerIndex];

    /*
       Home.
    */

    if(token.progress === -1){

        return HOME_POSITIONS[
            player.color
        ][token.index];

    }


    /*
       Finished.
    */

    if(token.progress >= FINISH_PROGRESS){

        return {
            x:50,
            y:50
        };

    }


    /*
       Home lane.
    */

    if(token.progress >= 52){

        const laneIndex =
            token.progress - 52;

        return LANES[
            player.color
        ][laneIndex];

    }


    /*
       Main track.
    */

    return getTrackPosition(
        token.playerIndex,
        token.progress
    );

}


/* =========================================================
   STACK OFFSET
   ========================================================= */

function getStackOffset(token){

    const samePlace = [];

    players.forEach(player=>{

        player.tokens.forEach(other=>{

            if(other === token){
                return;
            }

            if(
                other.progress < 0 ||
                other.progress >= 58
            ){
                return;
            }

            if(
                token.progress >= 0 &&
                token.progress < 52 &&
                other.progress >= 0 &&
                other.progress < 52
            ){

                const a =
                    (
                        START_INDEX[token.playerIndex] +
                        token.progress
                    ) % 52;

                const b =
                    (
                        START_INDEX[other.playerIndex] +
                        other.progress
                    ) % 52;

                if(a === b){
                    samePlace.push(other);
                }

            }

            else if(
                token.playerIndex === other.playerIndex &&
                token.progress === other.progress
            ){

                samePlace.push(other);

            }

        });

    });


    if(samePlace.length === 0){
        return {x:0,y:0};
    }

    const position =
        samePlace.length % 4;

    const offsets = [
        {x:-1.8,y:-1.8},
        {x:1.8,y:-1.8},
        {x:-1.8,y:1.8},
        {x:1.8,y:1.8}
    ];

    return offsets[position] ||
           {x:0,y:0};

}


/* =========================================================
   RENDER TOKENS
   ========================================================= */

function renderTokens(){

    players.forEach(player=>{

        player.tokens.forEach(token=>{

            const position =
                getTokenPosition(token);

            const offset =
                getStackOffset(token);

            const x =
                position.x + offset.x;

            const y =
                position.y + offset.y;

            const el =
                token.element;

            if(!el){
                return;
            }

            el.style.left =
                x + "%";

            el.style.top =
                y + "%";

            el.classList.remove(
                "movable",
                "selected"
            );

        });

    });


    /*
       Highlight legal tokens.
    */

    if(
        diceValue > 0 &&
        !gameOver
    ){

        getMovableTokens(
            currentPlayer,
            diceValue
        ).forEach(token=>{

            token.element.classList.add(
                "movable"
            );

        });

    }

}

/* =========================================================
   STATUS
   ========================================================= */

function setStatus(text){

/* =========================================================
   MOVEMENT RULES
   ========================================================= */

function canMoveToken(
    token,
    roll
){

    /*
       Finished token cannot move.
    */

    if(token.progress >= FINISH_PROGRESS){
        return false;
    }


    /*
       Home token needs 6.
    */

    if(token.progress === -1){

        return roll === 6;

    }


    /*
       Exact finish required.
    */

    return (
        token.progress + roll
        <= FINISH_PROGRESS
    );

}


/* =========================================================
   GET MOVABLE TOKENS
   ========================================================= */

function getMovableTokens(
    playerIndex,
    roll
){

    const player =
        players[playerIndex];

    return player.tokens.filter(
        token =>
            canMoveToken(
                token,
                roll
            )
    );

}


/* =========================================================
   ROLL DICE
   ========================================================= */

function randomDice(){

    /*
       Normal dice probability.

       लगातार दो बार 6 आने पर
       अगली बार 6 को रोकते हैं,
       ताकि 6 बहुत ज्यादा लगातार न आए।
    */

    let value =
        Math.floor(
            Math.random() * 6
        ) + 1;

    if(
        lastWasSix &&
        value === 6
    ){

        value =
            Math.floor(
                Math.random() * 5
            ) + 1;

    }

    lastWasSix =
        value === 6;

    return value;

}


/* =========================================================
   ROLL ANIMATION
   ========================================================= */

async function animateDice(){

    diceRolling = true;

    rollBtn.disabled = true;

    diceBig.classList.add(
        "rolling"
    );

    soundDice();

    for(let i=0;i<8;i++){

        const temp =

            ) + 1;

        await wait(55);

    }

    );

}


/* =========================================================
   ROLL BUTTON
   ========================================================= */

rollBtn.addEventListener(
    "click",
    async ()=>{

        if(
            diceRolling ||
            gameOver ||
            players[currentPlayer].ai
        ){
            return;
        }

        initAudio();

        if(
            audioContext &&
            audioContext.state === "suspended"
        ){

            await audioContext.resume();

        }

        await performRoll();

    }
);


/* =========================================================
   PERFORM ROLL
   ========================================================= */

async function performRoll(){

    if(diceRolling){
        return;
    }

    diceValue =
        randomDice();

    await animateDice();

    diceBig.textContent =
        DICE_SYMBOLS[diceValue];

    document.getElementById(
        "cardDice" + currentPlayer
    ).textContent =
        DICE_SYMBOLS[diceValue];


    const movable =
        getMovableTokens(
            currentPlayer,
            diceValue
        );


    if(movable.length === 0){

        setStatus(
            players[currentPlayer].name +
            " को इस पासे से कोई चाल नहीं मिली।"
        );

        renderTokens();

        await wait(850);

        if(diceValue === 6){

            setStatus(
                players[currentPlayer].name +
                " को 6 मिला — फिर से चाल!"
            );

            diceValue = 0;

            rollBtn.disabled =
                players[currentPlayer].ai;

            if(players[currentPlayer].ai){
                scheduleAI();
            }

            return;

        }


        nextPlayer();

        return;

    }


    setStatus(
        players[currentPlayer].name +
        " — गोटी चुनें"
    );

    renderTokens();


    /*
       AI automatically chooses.
    */

    if(players[currentPlayer].ai){

        await wait(650);

        await aiChooseToken(
            movable
        );

    }

}


/* =========================================================
   TOKEN CLICK
   ========================================================= */

async function handleTokenClick(token){

    if(gameOver){
        return;
    }

    if(token.playerIndex !== currentPlayer){
        return;
    }

    if(players[currentPlayer].ai){
        return;
    }

    if(diceValue <= 0){
        return;
    }

    if(
        !canMoveToken(
            token,
            diceValue
        )
    ){
        return;
    }

    document
    .querySelectorAll(".token")
    .forEach(el=>{
        el.classList.remove(
            "selected"
        );
    });

    token.element.classList.add(
        "selected"
    );

    await moveToken(
        token,
        diceValue
    );

}


/* =========================================================
   MOVE TOKEN
   ========================================================= */

async function moveToken(
    token,
    roll
){

    rollBtn.disabled = true;

    token.element.classList.remove(
        "movable"
    );

    /*
       Home -> start.
    */

    if(token.progress === -1){

        token.progress = 0;

        renderTokens();

        soundMove();

        await wait(260);

    }

    else{

        /*
           Step-by-step movement.
        */

        for(let i=0;i<roll;i++){

            token.progress++;

            renderTokens();

            soundMove();

            await wait(115);

        }

    }


    /*
       Finish.
    */

    if(
        token.progress >=
        FINISH_PROGRESS
    ){

        token.progress =
            FINISH_PROGRESS;

        token.finished = true;

        renderTokens();

        beep(
            880,
            .18,
            "sine",
            .06
        );

        await wait(250);

    }


    /*
       Capture.
    */

    const captured =
        captureOpponents(token);

    if(captured){

        soundCapture();

        setStatus(
            players[currentPlayer].name +
            " ने विरोधी की गोटी काट दी! 💥"
        );

        renderTokens();

        await wait(500);

    }


    /*
       Win.
    */

    if(
        checkWin(
            currentPlayer
        )
    ){

        showWin(
            currentPlayer
        );

        return;

    }


    /*
       6 = extra turn.
    */

    if(roll === 6){

        diceValue = 0;

        setStatus(
            players[currentPlayer].name +
            " को 6 मिला — फिर से पासा फेंकें!"
        );

        renderTokens();

        if(players[currentPlayer].ai){

            scheduleAI();

        }else{

            rollBtn.disabled = false;

        }

        return;

    }


    diceValue = 0;

    nextPlayer();

}


/* =========================================================
   CAPTURE
   ========================================================= */

function getGlobalIndex(token){

    if(
        token.progress < 0 ||
        token.progress >= 52
    ){

        return -1;

    }

    return (
        START_INDEX[token.playerIndex] +
        token.progress
    ) % 52;

}


function captureOpponents(token){

    /*
       Home lane में capture नहीं।
    */

    if(
        token.progress < 0 ||
        token.progress >= 52
    ){

        return false;

    }


    const globalIndex =
        getGlobalIndex(token);


    /*
       Safe cell पर capture नहीं।
    */

    if(
        SAFE_INDEX.has(globalIndex)
    ){

        return false;

    }


    let captured = false;


    players.forEach(player=>{

        if(
            player.id === token.playerIndex
        ){
            return;
        }

        player.tokens.forEach(other=>{

            if(
                other.progress < 0 ||
                other.progress >= 52
            ){
                return;
            }

            if(
                getGlobalIndex(other) ===
                globalIndex
            ){

                /*
                   एक सामान्य गोटी पर
                   capture.
                */

                other.progress = -1;

                other.finished = false;

                captured = true;

            }

        });

    });


    return captured;

}


/* =========================================================
   WIN CHECK
   ========================================================= */

function checkWin(playerIndex){

    return players[playerIndex]
        .tokens
        .every(
            token =>
                token.progress >=
                FINISH_PROGRESS
        );

}


/* =========================================================
   NEXT PLAYER
   ========================================================= */

function nextPlayer(){

    diceValue = 0;

    let next =
        currentPlayer;

    do{

        next =
            (next + 1) % 4;

    }while(
        next !== currentPlayer &&
        players[next].tokens.every(
            token =>
                token.progress >=
                FINISH_PROGRESS
        )
    );


    currentPlayer =
        next;

    updatePlayerCards();

    renderTokens();


    setStatus(
        players[currentPlayer].name +
        " की बारी"
    );


    if(players[currentPlayer].ai){

        rollBtn.disabled = true;

        scheduleAI();

    }else{

        rollBtn.disabled = false;

    }

}


/* =========================================================
   AI
   ========================================================= */

function scheduleAI(){

    setTimeout(
        ()=>{

            if(
                gameOver ||
                !players[currentPlayer].ai
            ){
                return;
            }

            performRoll();

        },
        700
    );

}


/*
   AI token choice.

   Priority:

   1. Capture
   2. Finish
   3. Bring token out on 6
   4. Advance furthest
*/

async function aiChooseToken(
    movable
){

    if(
        !movable ||
        movable.length === 0
    ){

        nextPlayer();

        return;

    }


    let chosen =
        movable[0];


    /*
       Capture simulation.
    */

    for(const token of movable){

        const targetProgress =
            token.progress === -1
            ? 0
            : token.progress + diceValue;

        if(
            targetProgress < 52
        ){

            const targetGlobal =
                (
                    START_INDEX[token.playerIndex] +
                    targetProgress
                ) % 52;

            if(
                !SAFE_INDEX.has(targetGlobal)
            ){

                const enemyExists =
                    players.some(player=>{

                        if(
                            player.id ===
                            token.playerIndex
                        ){
                            return false;
                        }

                        return player.tokens.some(other=>{

                            return (
                                other.progress >= 0 &&
                                other.progress < 52 &&
                                getGlobalIndex(other) ===
                                targetGlobal
                            );

                        });

                    });

                if(enemyExists){

                    chosen = token;

                    break;

                }

            }

        }

    }


    /*
       Prefer exact finish.
    */

    for(const token of movable){

        if(
            token.progress >= 0 &&
            token.progress + diceValue ===
            FINISH_PROGRESS
        ){

            chosen = token;

            break;

        }

    }


    /*
       On 6, prefer bringing home token out.
    */

    if(diceValue === 6){

        const homeToken =
            movable.find(
                token =>
                    token.progress === -1
            );

        if(homeToken){

            chosen = homeToken;

        }

    }


    /*
       Otherwise move furthest.
    */

    if(
        chosen === movable[0] &&
        movable.length > 1
    ){

        chosen =
            movable.reduce(
                (best,token)=>
                    token.progress >
                    best.progress
                    ? token
                    : best,
                movable[0]
            );

    }


    await moveToken(
        chosen,
        diceValue
    );

}


/* =========================================================
   WAIT
   ========================================================= */

function wait(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


/* =========================================================
   WIN SCREEN
   ========================================================= */

function showWin(playerIndex){

    gameOver = true;

    rollBtn.disabled = true;

    const player =
        players[playerIndex];

    winTitle.textContent =
        "🎉 " +
        player.name +
        " जीत गया!";

    winText.textContent =
        "चारों गोटियाँ Finish में पहुँच गईं! 🏆";

    winOverlay.style.display =
        "flex";

    soundWin();

    createConfetti();

}


/* =========================================================
   CONFETTI
   ========================================================= */

function createConfetti(){

    const emojis = [
        "🎉",
        "🎊",
        "✨",
        "⭐",
        "🏆",
        "💥",
        "🥳"
    ];

    for(let i=0;i<70;i++){

        const piece =
            document.createElement("div");

        piece.className =
            "confetti";

        piece.textContent =
            emojis[
                Math.floor(
                    Math.random() *
                    emojis.length
                )
            ];

        piece.style.left =
            Math.random()*100 +
            "%";

        piece.style.animationDelay =
            Math.random()*1.5 +
            "s";

        piece.style.fontSize =
            (16 + Math.random()*20) +
            "px";

        winOverlay.appendChild(
            piece
        );

    }

}


/* =========================================================
   START GAME
   ========================================================= */

startBtn.addEventListener(
    "click",
    async ()=>{

        initAudio();

        if(
            audioContext &&
            audioContext.state === "suspended"
        ){

            await audioContext.resume();

        }

        startGame();

    }
);


function startGame(){

    setupPlayers();

    buildBoard();

    createTokens();

    currentPlayer = 0;

    diceValue = 0;

    gameOver = false;

    diceRolling = false;

    lastWasSix = false;

    winOverlay.style.display =
        "none";


    document
    .querySelectorAll(".confetti")
    .forEach(el=>el.remove());


    startScreen.style.display =
        "none";

    gameScreen.style.display =
        "block";


    diceBig.textContent =
        "⚀";


    rollBtn.disabled =
        players[0].ai;


    updatePlayerCards();

    renderTokens();


    setStatus(
        players[0].name +
        " की बारी — पासा फेंकें"
    );


    if(players[0].ai){

        scheduleAI();

    }

}


/* =========================================================
   NEW GAME
   ========================================================= */

document.getElementById(
    "newGameBtn"
).addEventListener(
    "click",
    ()=>{

        gameScreen.style.display =
            "none";

        startScreen.style.display =
            "flex";

        winOverlay.style.display =
            "none";

        gameOver = false;

    }
);


/* =========================================================
   RESTART
   ========================================================= */

document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    ()=>{

        winOverlay.style.display =
            "none";

        document
        .querySelectorAll(".confetti")
        .forEach(el=>el.remove());

        startGame();

    }
);


/* =========================================================
   FULLSCREEN
   ========================================================= */

document.getElementById(
    "fullscreenBtn"
).addEventListener(
    "click",
    async ()=>{

        try{

            if(!document.fullscreenElement){

                await document.documentElement
                    .requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(e){

            /*
               कुछ mobile browsers
               fullscreen API allow नहीं करते।
            */

        }

    }
);


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
   ========================================================= */

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    event=>{

        const now =
            Date.now();

        if(
            now - lastTouchEnd <= 300
        ){

            event.preventDefault();

        }

        lastTouchEnd = now;

    },
    {passive:false}
);


/* =========================================================
   INITIAL BOARD
   ========================================================= */

buildBoard();

</script>
