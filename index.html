<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Color Clash Ludo</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg1:#17142e;
    --bg2:#30205c;
    --panel:rgba(255,255,255,.10);
    --white:#fff;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 15% 15%,#ff3d81 0,transparent 25%),
        radial-gradient(circle at 85% 20%,#00d9ff 0,transparent 25%),
        radial-gradient(circle at 50% 100%,#ffb300 0,transparent 25%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    color:white;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:12px;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.logo{
    font-size:clamp(22px,5vw,38px);
    font-weight:900;
    letter-spacing:-1px;
    background:linear-gradient(90deg,#ffe600,#ff4d8d,#00e5ff);
    -webkit-background-clip:text;
    color:transparent;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:14px;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:20px;
    cursor:pointer;
}

.panel{
    background:rgba(10,8,35,.55);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 15px 45px rgba(0,0,0,.25);
    backdrop-filter:blur(16px);
    border-radius:24px;
}

.top-panel{
    padding:12px;
    margin-bottom:12px;
}

.player-selector{
    display:flex;
    gap:8px;
    overflow-x:auto;
}

.player-btn{
    flex:1;
    min-width:90px;
    padding:11px 14px;
    border:0;
    border-radius:14px;
    color:white;
    background:rgba(255,255,255,.09);
    font-weight:800;
    cursor:pointer;
}

.player-btn.active{
    background:linear-gradient(135deg,#ff267e,#7c3cff);
    box-shadow:0 7px 20px rgba(255,38,126,.35);
}

.game-layout{
    display:grid;
    grid-template-columns:minmax(280px,1fr) 290px;
    gap:14px;
    align-items:start;
}

.board-wrap{
    padding:12px;
    position:relative;
}

.board{
    width:min(92vw,720px);
    aspect-ratio:1;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    border-radius:20px;
    padding:5px;
    gap:2px;
    background:#151326;
    box-shadow:
        0 0 0 3px rgba(255,255,255,.12),
        0 25px 60px rgba(0,0,0,.4);
    position:relative;
    overflow:hidden;
}

.cell{
    position:relative;
    border-radius:4px;
    min-width:0;
    min-height:0;
}

.home{
    grid-column:span 6;
    grid-row:span 6;
    border-radius:10px;
    padding:8px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:5px;
}

.home.red{background:linear-gradient(135deg,#ff315c,#b90042)}
.home.green{background:linear-gradient(135deg,#00db8b,#008e61)}
.home.yellow{background:linear-gradient(135deg,#ffd900,#ff8a00)}
.home.blue{background:linear-gradient(135deg,#00c8ff,#2464ff)}
.home.purple{background:linear-gradient(135deg,#c43dff,#6424d8)}
.home.orange{background:linear-gradient(135deg,#ff8b27,#ff3b00)}

.base{
    background:rgba(255,255,255,.88);
    border-radius:50%;
    margin:5px;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.15);
    display:flex;
    align-items:center;
    justify-content:center;
}

.base::after{
    content:"";
    width:52%;
    height:52%;
    border-radius:50%;
    background:rgba(0,0,0,.08);
}

.track{
    background:#f9f7ff;
    border:1px solid rgba(30,20,70,.12);
}

.path-red{background:#ff5475}
.path-green{background:#3ee4a3}
.path-yellow{background:#ffe85a}
.path-blue{background:#55cfff}
.path-purple{background:#c678ff}
.path-orange{background:#ffad63}

.center{
    grid-column:7 / span 3;
    grid-row:7 / span 3;
    background:conic-gradient(
        #ff315c 0 16.6%,
        #ffd900 16.6% 33.2%,
        #00db8b 33.2% 49.8%,
        #00bfff 49.8% 66.4%,
        #a948ff 66.4% 83%,
        #ff741f 83% 100%
    );
    clip-path:polygon(50% 50%,0 0,100% 0,100% 100%,0 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(18px,5vw,40px);
    z-index:2;
}

.token{
    position:absolute;
    width:78%;
    height:78%;
    left:11%;
    top:11%;
    border-radius:50%;
    border:3px solid white;
    box-shadow:
        0 5px 8px rgba(0,0,0,.35),
        inset 0 3px 5px rgba(255,255,255,.45);
    z-index:20;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:clamp(9px,2vw,17px);
    font-weight:900;
    transition:.2s;
    animation:tokenAppear .25s ease;
}

.token:hover{
    transform:scale(1.12);
}

.token.movable{
    animation:pulse .8s infinite alternate;
    box-shadow:
        0 0 0 4px rgba(255,255,255,.45),
        0 0 18px white;
}

.token.red{background:linear-gradient(145deg,#ff6681,#d9003c)}
.token.green{background:linear-gradient(145deg,#54f0b3,#009c68)}
.token.yellow{background:linear-gradient(145deg,#fff45a,#f49a00);color:#422800}
.token.blue{background:linear-gradient(145deg,#64ddff,#155aff)}
.token.purple{background:linear-gradient(145deg,#df79ff,#7225d8)}
.token.orange{background:linear-gradient(145deg,#ffbd67,#ff421b)}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.14)}
}

@keyframes tokenAppear{
    from{transform:scale(.3);opacity:0}
    to{transform:scale(1);opacity:1}
}

.side{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.status{
    padding:18px;
}

.turn-title{
    font-size:13px;
    opacity:.7;
    text-transform:uppercase;
    letter-spacing:1px;
}

.turn-name{
    font-size:24px;
    font-weight:900;
    margin-top:3px;
}

.turn-dot{
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:50%;
    margin-right:7px;
}

.dice-box{
    padding:18px;
    text-align:center;
}

.dice{
    width:92px;
    height:92px;
    margin:10px auto 14px;
    border-radius:22px;
    background:linear-gradient(145deg,#fff,#dce3ff);
    color:#25204d;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:58px;
    font-weight:900;
    box-shadow:0 15px 25px rgba(0,0,0,.25);
}

.dice.rolling{
    animation:roll .55s ease-in-out;
}

@keyframes roll{
    0%{transform:rotate(0) scale(1)}
    25%{transform:rotate(90deg) scale(1.1)}
    50%{transform:rotate(180deg) scale(.9)}
    75%{transform:rotate(270deg) scale(1.1)}
    100%{transform:rotate(360deg) scale(1)}
}

.roll-btn{
    width:100%;
    border:0;
    padding:15px;
    border-radius:16px;
    color:white;
    font-size:17px;
    font-weight:900;
    cursor:pointer;
    background:linear-gradient(135deg,#ff246e,#793dff);
    box-shadow:0 10px 25px rgba(121,61,255,.35);
}

.roll-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.info{
    padding:15px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.info-row:last-child{
    border:0;
}

.settings{
    padding:16px;
}

.settings h3{
    margin-bottom:12px;
}

.setting-label{
    font-size:12px;
    opacity:.7;
    margin:12px 0 6px;
}

.theme-buttons,
.skin-buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.theme-btn,
.skin-btn{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.08);
    color:white;
    border-radius:10px;
    padding:8px 5px;
    cursor:pointer;
    font-size:11px;
    font-weight:bold;
}

.skin-preview{
    font-size:20px;
    display:block;
    margin-bottom:3px;
}

.modal{
    position:fixed;
    inset:0;
    z-index:99999;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(440px,100%);
    background:#211a42;
    border:1px solid rgba(255,255,255,.18);
    border-radius:28px;
    padding:25px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
}

.winner-icon{
    font-size:75px;
    animation:bounce 1s infinite alternate;
}

@keyframes bounce{
    to{transform:translateY(-12px) scale(1.1)}
}

.modal-card h2{
    font-size:34px;
    margin:8px 0;
}

.modal-card button{
    width:100%;
    border:0;
    border-radius:15px;
    padding:14px;
    margin-top:15px;
    color:white;
    background:linear-gradient(135deg,#ff2d76,#7444ff);
    font-weight:900;
    font-size:16px;
}

.confetti{
    position:fixed;
    top:-20px;
    width:10px;
    height:16px;
    z-index:100000;
    animation:fall 2.5s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

@media(max-width:800px){
    .game-layout{
        grid-template-columns:1fr;
    }

    .side{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .status{
        grid-column:1/-1;
    }

    .settings{
        grid-column:1/-1;
    }
}

@media(max-width:500px){
    .app{
        padding:7px;
    }

    header{
        margin-bottom:7px;
    }

    .logo{
        font-size:22px;
    }

    .icon-btn{
        width:38px;
        height:38px;
    }

    .board-wrap{
        padding:6px;
    }

    .board{
        width:96vw;
        padding:3px;
        gap:1px;
        border-radius:14px;
    }

    .home{
        padding:4px;
        gap:2px;
    }

    .base{
        margin:3px;
    }

    .side{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:7px;
    }

    .dice-box,
    .status,
    .info,
    .settings{
        padding:12px;
        border-radius:17px;
    }

    .dice{
        width:70px;
        height:70px;
        font-size:42px;
        border-radius:17px;
    }

    .turn-name{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">🎲 COLOR CLASH</div>

    <div class="header-actions">
        <button class="icon-btn" onclick="newGame()">↻</button>
        <button class="icon-btn" onclick="toggleSound()" id="soundBtn">🔊</button>
    </div>
</header>

<div class="panel top-panel">
    <div class="player-selector">
        <button class="player-btn active" onclick="setPlayers(2,this)">2 Players</button>
        <button class="player-btn" onclick="setPlayers(4,this)">4 Players</button>
        <button class="player-btn" onclick="setPlayers(6,this)">6 Players</button>
    </div>
</div>

<div class="game-layout">

<div class="panel board-wrap">
    <div class="board" id="board"></div>
</div>

<div class="side">

    <div class="panel status">
        <div class="turn-title">Current Turn</div>
        <div class="turn-name" id="turnName">
            <span class="turn-dot" id="turnDot"></span>
            Red Player
        </div>
    </div>

    <div class="panel dice-box">
        <div>🎲 Roll The Dice</div>
        <div class="dice" id="dice">⚀</div>
        <button class="roll-btn" id="rollBtn" onclick="rollDice()">
            ROLL DICE
        </button>
    </div>

    <div class="panel info">
        <div class="info-row">
            <span>Players</span>
            <b id="playerCount">2</b>
        </div>

        <div class="info-row">
            <span>Turn</span>
            <b id="turnNumber">1</b>
        </div>

        <div class="info-row">
            <span>Selected Skin</span>
            <b id="currentSkin">Classic</b>
        </div>

        <div class="info-row">
            <span>Safe Spots</span>
            <b>⭐</b>
        </div>
    </div>

    <div class="panel settings">

        <h3>🎨 Customization</h3>

        <div class="setting-label">BOARD THEME</div>

        <div class="theme-buttons">
            <button class="theme-btn" onclick="changeTheme('neon')">🌈 Neon</button>
            <button class="theme-btn" onclick="changeTheme('candy')">🍭 Candy</button>
            <button class="theme-btn" onclick="changeTheme('ocean')">🌊 Ocean</button>
            <button class="theme-btn" onclick="changeTheme('sunset')">🌅 Sunset</button>
            <button class="theme-btn" onclick="changeTheme('galaxy')">🌌 Galaxy</button>
            <button class="theme-btn" onclick="changeTheme('forest')">🌲 Forest</button>
        </div>

        <div class="setting-label">TOKEN SKIN</div>

        <div class="skin-buttons">

            <button class="skin-btn" onclick="changeSkin('classic')">
                <span class="skin-preview">♟</span>
                Classic
            </button>

            <button class="skin-btn" onclick="changeSkin('crown')">
                <span class="skin-preview">♛</span>
                Crown
            </button>

            <button class="skin-btn" onclick="changeSkin('shield')">
                <span class="skin-preview">🛡️</span>
                Shield
            </button>

            <button class="skin-btn" onclick="changeSkin('star')">
                <span class="skin-preview">★</span>
                Star
            </button>

            <button class="skin-btn" onclick="changeSkin('diamond')">
                <span class="skin-preview">◆</span>
                Diamond
            </button>

            <button class="skin-btn" onclick="changeSkin('gem')">
                <span class="skin-preview">💎</span>
                Gem
            </button>

        </div>

    </div>

</div>
</div>
</div>

<div class="modal" id="winnerModal">
    <div class="modal-card">
        <div class="winner-icon">🏆</div>
        <h2 id="winnerTitle">Red Wins!</h2>
        <p>Congratulations! You completed all your tokens.</p>
        <button onclick="newGame()">PLAY AGAIN</button>
    </div>
</div>

<script>

const playersData = [
    {
        name:"Red",
        color:"red",
        emoji:"🔴",
        tokens:4
    },
    {
        name:"Green",
        color:"green",
        emoji:"🟢",
        tokens:4
    },
    {
        name:"Yellow",
        color:"yellow",
        emoji:"🟡",
        tokens:4
    },
    {
        name:"Blue",
        color:"blue",
        emoji:"🔵",
        tokens:4
    },
    {
        name:"Purple",
        color:"purple",
        emoji:"🟣",
        tokens:4
    },
    {
        name:"Orange",
        color:"orange",
        emoji:"🟠",
        tokens:4
    }
];

const tokenSymbols={
    classic:"♟",
    crown:"♛",
    shield:"🛡️",
    star:"★",
    diamond:"◆",
    gem:"💎"
};

let playerCount=2;
let currentPlayer=0;
let diceValue=0;
let turn=1;
let selectedSkin="classic";
let soundOn=true;
let rolling=false;

let gamePlayers=[];

/*
    Each player has 4 tokens.
    -1 = home
     0...51 = board progress
    57 = finished
*/

let tokenPositions=[];

const colors={
    red:"#ff315c",
    green:"#00db8b",
    yellow:"#ffd900",
    blue:"#00bfff",
    purple:"#a948ff",
    orange:"#ff741f"
};

const themes={
    neon:["#17142e","#30205c"],
    candy:["#40152d","#7d2465"],
    ocean:["#062d45","#064b70"],
    sunset:["#40190d","#7c3019"],
    galaxy:["#09091d","#26145e"],
    forest:["#071f16","#0d4733"]
};

const paths=[
    [6,0],[7,0],[8,0],
    [9,0],[10,0],[11,0],[12,0],
    [12,1],[12,2],[12,3],[12,4],[12,5],
    [13,6],[14,6],
    [14,7],
    [14,8],[13,8],
    [12,9],[12,10],[12,11],[12,12],
    [11,12],[10,12],[9,12],[8,12],
    [7,12],[6,12],
    [6,13],[6,14],
    [5,14],
    [4,14],[4,13],[4,12],
    [3,12],[2,12],[1,12],[0,12],
    [0,11],[0,10],[0,9],[0,8],
    [0,7],
    [0,6],[1,6],[2,6],[3,6],[4,6],[5,6],
    [6,5],[6,4],[6,3],[6,2],[6,1]
];

const safeSpots=[
    0,8,13,21,26,34,39,47
];

function setPlayers(n,btn){

    playerCount=n;

    document.querySelectorAll(".player-btn")
        .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    document.getElementById("playerCount").textContent=n;

    newGame();
}

function createPlayers(){

    gamePlayers=playersData.slice(0,playerCount);
}

function createBoard(){

    const board=document.getElementById("board");

    board.innerHTML="";

    /*
        Create 225 cells.
        Certain areas are converted into colored homes.
    */

    for(let r=0;r<15;r++){

        for(let c=0;c<15;c++){

            const cell=document.createElement("div");

            cell.className="cell";

            /*
                Home zones
            */

            if(r<6 && c<6){
                cell.classList.add("home","red");
            }
            else if(r<6 && c>8){
                cell.classList.add("home","green");
            }
            else if(r>8 && c<6){
                cell.classList.add("home","yellow");
            }
            else if(r>8 && c>8){
                cell.classList.add("home","blue");
            }
            else if(r<3 && c>5 && c<9){
                cell.classList.add("path-purple");
            }
            else if(r>11 && c>5 && c<9){
                cell.classList.add("path-orange");
            }
            else if(r===7 && c===7){

                cell.classList.add("center");
                cell.innerHTML="🏆";
            }
            else{

                const index=paths.findIndex(p=>p[0]===c && p[1]===r);

                if(index!==-1){

                    cell.classList.add("track");

                    if(safeSpots.includes(index)){
                        cell.innerHTML="⭐";
                        cell.style.display="flex";
                        cell.style.alignItems="center";
                        cell.style.justifyContent="center";
                        cell.style.fontSize="clamp(8px,2vw,15px)";
                    }

                    if(index===0) cell.classList.add("path-red");
                    if(index===13) cell.classList.add("path-green");
                    if(index===26) cell.classList.add("path-blue");
                    if(index===39) cell.classList.add("path-yellow");
                }
                else{
                    cell.style.background="rgba(255,255,255,.035)";
                }
            }

            board.appendChild(cell);
        }
    }

    /*
        Add home tokens.
    */

    addHomeTokens();
}

function addHomeTokens(){

    const board=document.getElementById("board");

    const homePositions=[
        {player:0,cells:[16,18,46,48]},
        {player:1,cells:[23,25,53,55]},
        {player:2,cells:[151,153,181,183]},
        {player:3,cells:[158,160,188,190]},
        {player:4,cells:[6,8,36,38]},
        {player:5,cells:[173,175,203,205]}
    ];

    gamePlayers.forEach((p,i)=>{

        const data=homePositions[i];

        data.cells.forEach((cellIndex,t)=>{

            if(!board.children[cellIndex]) return;

            const base=document.createElement("div");

            base.className="base";

            base.dataset.player=i;
            base.dataset.token=t;

            base.onclick=()=>moveToken(i,t);

            board.children[cellIndex].appendChild(base);

            const token=document.createElement("div");

            token.className=`token ${p.color}`;

            token.dataset.player=i;
            token.dataset.token=t;

            token.textContent=tokenSymbols[selectedSkin];

            base.appendChild(token);
        });
    });
}

function renderTokens(){

    createBoard();

    gamePlayers.forEach((p,pi)=>{

        for(let ti=0;ti<4;ti++){

            const position=tokenPositions[pi][ti];

            if(position>=0 && position<52){

                const [x,y]=paths[position];

                const index=y*15+x;

                const cell=document.getElementById("board").children[index];

                if(cell){

                    const token=document.createElement("div");

                    token.className=`token ${p.color}`;

                    token.dataset.player=pi;
                    token.dataset.token=ti;

                    token.textContent=tokenSymbols[selectedSkin];

                    token.onclick=(e)=>{
                        e.stopPropagation();
                        moveToken(pi,ti);
                    };

                    cell.appendChild(token);
                }
            }

            else if(position===57){

                // Finished tokens remain visually near center.
                const center=document.querySelector(".center");

                if(center){

                    const token=document.createElement("div");

                    token.className=`token ${p.color}`;

                    token.textContent=tokenSymbols[selectedSkin];

                    token.style.position="absolute";
                    token.style.width="25%";
                    token.style.height="25%";
                    token.style.left=(20+ti*17)+"%";
                    token.style.top="38%";

                    center.appendChild(token);
                }
            }
        }
    });

    highlightMovableTokens();
}

function highlightMovableTokens(){

    if(!diceValue || rolling) return;

    if(gamePlayers[currentPlayer].name){

        const movable=[];

        for(let t=0;t<4;t++){

            const pos=tokenPositions[currentPlayer][t];

            if(
                (pos===-1 && diceValue===6) ||
                (pos>=0 && pos<57 && pos+diceValue<=57)
            ){
                movable.push(t);
            }
        }

        movable.forEach(t=>{

            document
                .querySelectorAll(
                    `.token[data-player="${currentPlayer}"][data-token="${t}"]`
                )
                .forEach(el=>el.classList.add("movable"));
        });
    }
}

function rollDice(){

    if(rolling) return;

    if(!canPlayerMove()){
        return;
    }

    rolling=true;

    const dice=document.getElementById("dice");

    dice.classList.add("rolling");

    let count=0;

    const animation=setInterval(()=>{

        const n=Math.floor(Math.random()*6)+1;

        dice.textContent=diceSymbol(n);

        count++;

        if(count>=9){

            clearInterval(animation);

            diceValue=Math.floor(Math.random()*6)+1;

            dice.textContent=diceSymbol(diceValue);

            dice.classList.remove("rolling");

            rolling=false;

            renderTokens();

            if(!hasAnyMove()){

                setTimeout(()=>{
                    nextTurn();
                },700);

            }

        }

    },70);
}

function canPlayerMove(){

    return true;
}

function hasAnyMove(){

    for(let t=0;t<4;t++){

        const pos=tokenPositions[currentPlayer][t];

        if(pos===-1 && diceValue===6) return true;

        if(pos>=0 && pos<57 && pos+diceValue<=57) return true;
    }

    return false;
}

function moveToken(player,token){

    if(player!==currentPlayer) return;

    if(!diceValue || rolling) return;

    const pos=tokenPositions[player][token];

    /*
        Token in home.
    */

    if(pos===-1){

        if(diceValue!==6) return;

        tokenPositions[player][token]=0;

        playSound(500);

        diceValue=0;

        renderTokens();

        return;
    }

    if(pos<0 || pos+diceValue>57) return;

    /*
        Move step-by-step for smooth effect.
    */

    animateTokenMove(player,token,pos+diceValue);

}

function animateTokenMove(player,token,target){

    let current=tokenPositions[player][token];

    const timer=setInterval(()=>{

        current++;

        tokenPositions[player][token]=current;

        renderTokens();

        if(current>=target){

            clearInterval(timer);

            afterMove(player,token);
        }

    },120);
}

function afterMove(player,token){

    /*
        Capture opponent.
    */

    if(tokenPositions[player][token]<52){

        const landing=tokenPositions[player][token];

        gamePlayers.forEach((p,pi)=>{

            if(pi===player) return;

            for(let t=0;t<4;t++){

                if(tokenPositions[pi][t]===landing && !safeSpots.includes(landing)){

                    tokenPositions[pi][t]=-1;

                    playSound(180);

                    createCaptureEffect(landing);
                }
            }
        });
    }

    const finished=tokenPositions[player].filter(x=>x===57).length;

    if(finished===4){

        showWinner(player);
        return;
    }

    const extraTurn=diceValue===6;

    diceValue=0;

    renderTokens();

    if(extraTurn){

        updateTurnText();
    }
    else{

        nextTurn();
    }
}

function nextTurn(){

    diceValue=0;

    currentPlayer++;

    if(currentPlayer>=playerCount){
        currentPlayer=0;
        turn++;
    }

    document.getElementById("turnNumber").textContent=turn;

    updateTurnText();

    renderTokens();

    /*
        Basic automatic play for extra players in 6-player mode.
    */

    if(playerCount===6 && currentPlayer>=2){

        setTimeout(()=>{

            rollDice();

        },700);

    }
}

function updateTurnText(){

    const p=gamePlayers[currentPlayer];

    document.getElementById("turnName").innerHTML=
        `<span class="turn-dot"
        style="background:${colors[p.color]}"></span>
        ${p.name} Player`;

    document.getElementById("turnDot").style.background=
        colors[p.color];
}

function diceSymbol(n){

    const symbols=["","⚀","⚁","⚂","⚃","⚄","⚅"];

    return symbols[n];
}

function changeSkin(skin){

    selectedSkin=skin;

    const names={
        classic:"Classic",
        crown:"Crown",
        shield:"Shield",
        star:"Star",
        diamond:"Diamond",
        gem:"Gem"
    };

    document.getElementById("currentSkin").textContent=names[skin];

    renderTokens();
}

function changeTheme(theme){

    const t=themes[theme];

    document.documentElement.style.setProperty("--bg1",t[0]);
    document.documentElement.style.setProperty("--bg2",t[1]);
}

function newGame(){

    document.getElementById("winnerModal").classList.remove("show");

    createPlayers();

    currentPlayer=0;
    diceValue=0;
    turn=1;
    rolling=false;

    tokenPositions=[];

    for(let i=0;i<playerCount;i++){

        tokenPositions.push([-1,-1,-1,-1]);
    }

    document.getElementById("turnNumber").textContent="1";

    updateTurnText();

    renderTokens();
}

function showWinner(player){

    document.getElementById("winnerTitle").textContent=
        `${gamePlayers[player].name} Wins!`;

    document.getElementById("winnerModal").classList.add("show");

    for(let i=0;i<70;i++){

        const c=document.createElement("div");

        c.className="confetti";

        c.style.left=Math.random()*100+"vw";

        c.style.background=
            `hsl(${Math.random()*360},100%,60%)`;

        c.style.animationDelay=
            Math.random()*.8+"s";

        document.body.appendChild(c);

        setTimeout(()=>c.remove(),3500);
    }

    playSound(900);
}

function createCaptureEffect(position){

    const board=document.getElementById("board");

    const [x,y]=paths[position];

    const index=y*15+x;

    const cell=board.children[index];

    if(!cell) return;

    const effect=document.createElement("div");

    effect.textContent="💥";

    effect.style.position="absolute";
    effect.style.inset="0";
    effect.style.display="flex";
    effect.style.alignItems="center";
    effect.style.justifyContent="center";
    effect.style.fontSize="25px";
    effect.style.zIndex="999";

    cell.appendChild(effect);

    setTimeout(()=>effect.remove(),500);
}

function toggleSound(){

    soundOn=!soundOn;

    document.getElementById("soundBtn").textContent=
        soundOn?"🔊":"🔇";
}

function playSound(freq){

    if(!soundOn) return;

    try{

        const AudioContext=
            window.AudioContext||
            window.webkitAudioContext;

        const ctx=new AudioContext();

        const osc=ctx.createOscillator();
        const gain=ctx.createGain();

        osc.frequency.value=freq;
        osc.type="sine";

        gain.gain.value=.06;

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();

        setTimeout(()=>{
            osc.stop();
            ctx.close();
        },120);

    }catch(e){}
}

/*
    Start game
*/

newGame();

</script>
