<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Real Ludo Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0f19; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
        h1 { color: #38bdf8; margin-bottom: 8px; font-size: 22px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        /* मोड सिलेक्शन बटन */
        .mode-selection { display: flex; gap: 8px; margin-bottom: 12px; }
        .mode-btn { padding: 6px 14px; background: #1e293b; color: white; border: 2px solid #38bdf8; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .mode-btn.active { background: #38bdf8; color: #0f172a; }

        #ludoCanvas { background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); max-width: 100%; height: auto; }
        
        .controls { margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 450px; }
        .status-box { font-size: 16px; font-weight: bold; background: #1e293b; padding: 10px 15px; border-radius: 8px; border: 1px solid #38bdf8; text-align: center; width: 100%; color: #38bdf8; }
        .dice-container { display: flex; align-items: center; justify-content: center; gap: 15px; }
        .dice-view { width: 50px; height: 50px; background: white; color: #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; border: 3px solid #38bdf8; }
        .btn-roll { padding: 10px 20px; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

<h1>🎲 ULTIMATE REAL LUDO 🎲</h1>

<!-- प्लेयर मोड बूटन -->
<div class="mode-selection">
    <button class="mode-btn active" onclick="setGameMode('2P', this)">2 Player</button>
    <button class="mode-btn" onclick="setGameMode('3P', this)">3 Player</button>
    <button class="mode-btn" onclick="setGameMode('4P', this)">4 Player</button>
    <button class="mode-btn" onclick="setGameMode('AI', this)">1 vs AI 🤖</button>
</div>

<canvas id="ludoCanvas" width="450" height="450"></canvas>

<div class="controls">
    <div class="status-box" id="statusText">RED की बारी - पासा फेंको</div>
    <div class="dice-container">
        <div class="dice-view" id="diceVal">-</div>
        <button class="btn-roll" id="rollBtn" onclick="rollDice()">पासा फेंको 🎲</button>
    </div>
</div>

<script>
const canvas = document.getElementById("ludoCanvas");
const ctx = canvas.getContext("2d");

const tileSize = 30; // 15x15 Grid
let turn = "red";
let diceValue = 0;
let canRoll = true;
let gameMode = "2P";

const activePlayers = {
    "2P": ["red", "yellow"],
    "3P": ["red", "green", "yellow"],
    "4P": ["red", "green", "yellow", "blue"],
    "AI": ["red", "green"] // green is AI
};

const commonPath = [
    [1,6],[2,6],[3,6],[4,6],[5,6], [6,5],[6,4],[6,3],[6,2],[6,1],[6,0], [7,0],[8,0],
    [8,1],[8,2],[8,3],[8,4],[8,5], [9,6],[10,6],[11,6],[12,6],[13,6],[14,6], [14,7],[14,8],
    [13,8],[12,8],[11,8],[10,8],[9,8], [8,9],[8,10],[8,11],[8,12],[8,13],[8,14], [7,14],[6,14],
    [6,13],[6,12],[6,11],[6,10],[6,9], [5,8],[4,8],[3,8],[2,8],[1,8],[0,8], [0,7],[0,6]
];

const startIndices = { red: 0, green: 13, yellow: 26, blue: 39 };

const tokens = {
    red:    [{ pos: -1, base: [2.5, 2.5] }, { pos: -1, base: [3.5, 2.5] }, { pos: -1, base: [2.5, 3.5] }, { pos: -1, base: [3.5, 3.5] }],
    green:  [{ pos: -1, base: [11.5, 2.5] }, { pos: -1, base: [12.5, 2.5] }, { pos: -1, base: [11.5, 3.5] }, { pos: -1, base: [12.5, 3.5] }],
    yellow: [{ pos: -1, base: [11.5, 11.5] }, { pos: -1, base: [12.5, 11.5] }, { pos: -1, base: [11.5, 12.5] }, { pos: -1, base: [12.5, 12.5] }],
    blue:   [{ pos: -1, base: [2.5, 11.5] }, { pos: -1, base: [3.5, 11.5] }, { pos: -1, base: [2.5, 12.5] }, { pos: -1, base: [3.5, 12.5] }]
};

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function setGameMode(mode, btn) {
    gameMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    resetGame();
}

function resetGame() {
    turn = activePlayers[gameMode][0];
    canRoll = true;
    diceValue = 0;
    for(let c in tokens) {
        tokens[c].forEach(t => t.pos = -1);
    }
    document.getElementById("diceVal").innerText = "-";
    document.getElementById("statusText").innerText = `${turn.toUpperCase()} की बारी - पासा फेंको`;
    drawBoard();
}

function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for(let r=0; r<15; r++){
        for(let c=0; c<15; c++){
            ctx.strokeStyle = "#e2e8f0";
            ctx.strokeRect(c*tileSize, r*tileSize, tileSize, tileSize);
        }
    }

    // Bases
    drawBox(0, 0, 6, 6, "#ef4444");   // Red
    drawBox(9, 0, 6, 6, "#22c55e");   // Green
    drawBox(9, 9, 6, 6, "#eab308");   // Yellow
    drawBox(0, 9, 6, 6, "#3b82f6");   // Blue

    // Base White Box
    drawBox(1, 1, 4, 4, "#ffffff");
    drawBox(10, 1, 4, 4, "#ffffff");
    drawBox(10, 10, 4, 4, "#ffffff");
    drawBox(1, 10, 4, 4, "#ffffff");

    // Color Home Paths
    for(let i=1; i<6; i++) {
        drawBox(i, 7, 1, 1, "#ef4444");  // Red Path
        drawBox(7, i, 1, 1, "#22c55e");  // Green Path
        drawBox(14-i, 7, 1, 1, "#eab308"); // Yellow Path
        drawBox(7, 14-i, 1, 1, "#3b82f6"); // Blue Path
    }

    // Starting Safe Spots
    drawBox(1, 6, 1, 1, "#ef4444");
    drawBox(8, 1, 1, 1, "#22c55e");
    drawBox(13, 8, 1, 1, "#eab308");
    drawBox(6, 13, 1, 1, "#3b82f6");

    // Draw Entry Arrows
    drawArrow(0, 7, "right", "#ef4444");
    drawArrow(7, 0, "down", "#22c55e");
    drawArrow(14, 7, "left", "#eab308");
    drawArrow(7, 14, "up", "#3b82f6");

    // Center Home Box
    ctx.fillStyle = "#1e293b";
    ctx.fillRect(6*tileSize, 6*tileSize, 3*tileSize, 3*tileSize);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("HOME 🏆", 6.2*tileSize, 7.7*tileSize);

    drawTokens();
}

function drawBox(col, row, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(col*tileSize, row*tileSize, w*tileSize, h*tileSize);
    ctx.strokeStyle = "#475569";
    ctx.strokeRect(col*tileSize, row*tileSize, w*tileSize, h*tileSize);
}

function drawArrow(col, row, dir, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    let x = col * tileSize;
    let y = row * tileSize;
    if(dir === "right") {
        ctx.moveTo(x, y); ctx.lineTo(x + tileSize, y + tileSize/2); ctx.lineTo(x, y + tileSize);
    } else if(dir === "down") {
        ctx.moveTo(x, y); ctx.lineTo(x + tileSize/2, y + tileSize); ctx.lineTo(x + tileSize, y);
    } else if(dir === "left") {
        ctx.moveTo(x + tileSize, y); ctx.lineTo(x, y + tileSize/2); ctx.lineTo(x + tileSize, y + tileSize);
    } else if(dir === "up") {
        ctx.moveTo(x, y + tileSize); ctx.lineTo(x + tileSize/2, y); ctx.lineTo(x + tileSize, y + tileSize);
    }
    ctx.closePath();
    ctx.fill();
}

function drawTokens() {
    const colors = { red: "#dc2626", green: "#16a34a", yellow: "#ca8a04", blue: "#2563eb" };
    
    activePlayers[gameMode].forEach(c => {
        tokens[c].forEach(t => {
            let cx, cy;
            if (t.pos === -1) {
                cx = t.base[0] * tileSize;
                cy = t.base[1] * tileSize;
            } else {
                let pathIdx = (startIndices[c] + t.pos) % 52;
                cx = (commonPath[pathIdx][0] + 0.5) * tileSize;
                cy = (commonPath[pathIdx][1] + 0.5) * tileSize;
            }

            ctx.beginPath();
            ctx.arc(cx, cy, 11, 0, Math.PI * 2);
            ctx.fillStyle = colors[c];
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#ffffff";
            ctx.stroke();
        });
    });
}

function rollDice() {
    if (!canRoll) return;
    playSound(500);
    diceValue = Math.floor(Math.random() * 6) + 1;
    document.getElementById("diceVal").innerText = diceValue;
    canRoll = false;

    document.getElementById("statusText").innerText = `${turn.toUpperCase()} को ${diceValue} मिला! गोटी चुनें`;

    let moveable = tokens[turn].some(t => t.pos !== -1 || diceValue === 6);
    if (!moveable) {
        setTimeout(() => {
            switchTurn();
        }, 1000);
    } else if (gameMode === "AI" && turn === "green") {
        setTimeout(makeAIMove, 1000);
    }
}

function makeAIMove() {
    let t = tokens["green"].find(t => t.pos === -1 && diceValue === 6) || tokens["green"].find(t => t.pos >= 0);
    if (t) {
        if (t.pos === -1 && diceValue === 6) t.pos = 0;
        else if (t.pos >= 0) t.pos += diceValue;
        playSound(700);
        drawBoard();
    }
    checkTurnAfterMove();
}

canvas.addEventListener("click", function(e) {
    if (canRoll || diceValue === 0 || (gameMode === "AI" && turn === "green")) return;

    const rect = canvas.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;

    tokens[turn].forEach(t => {
        let cx, cy;
        if (t.pos === -1) {
            cx = t.base[0] * tileSize;
            cy = t.base[1] * tileSize;
        } else {
            let pathIdx = (startIndices[turn] + t.pos) % 52;
            cx = (commonPath[pathIdx][0] + 0.5) * tileSize;
            cy = (commonPath[pathIdx][1] + 0.5) * tileSize;
        }

        let dist = Math.hypot(clickX - cx, clickY - cy);
        if (dist < 15) {
            if (t.pos === -1 && diceValue === 6) {
                t.pos = 0;
                playSound(800);
                drawBoard();
                checkTurnAfterMove();
            } else if (t.pos >= 0) {
                t.pos += diceValue;
                playSound(700);
                drawBoard();
                checkTurnAfterMove();
            }
        }
    });
});

function checkTurnAfterMove() {
    if (diceValue === 6) {
        document.getElementById("statusText").innerText = `${turn.toUpperCase()} को 6 मिला! फिर से पासा फेंकें।`;
        canRoll = true;
        diceValue = 0;
    } else {
        switchTurn();
    }
}

function switchTurn() {
    const players = activePlayers[gameMode];
    let idx = players.indexOf(turn);
    turn = players[(idx + 1) % players.length];
    canRoll = true;
    diceValue = 0;
    document.getElementById("diceVal").innerText = "-";
    document.getElementById("statusText").innerText = `${turn.toUpperCase()} की बारी - पासा फेंको`;

    if (gameMode === "AI" && turn === "green") {
        setTimeout(rollDice, 1000);
    }
}

drawBoard();
</script>

</body>
</html>
