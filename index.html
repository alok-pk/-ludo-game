<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traditional 4 Player Ludo</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#17172f,#3b1764);
    font-family:Arial,sans-serif;
}

.ludo-board{
    width:min(94vw,700px);
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    background:#111;
    border:5px solid #111;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

/* Every cell */
.cell{
    position:relative;
    border:1px solid #222;
    background:#fff;
}

/* HOME AREAS */

.home{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    padding:12%;
    gap:12%;
    border:2px solid #111;
}

/* Red */
.red-home{
    grid-column:1 / 7;
    grid-row:1 / 7;
    background:#e53935;
}

/* Green */
.green-home{
    grid-column:10 / 16;
    grid-row:1 / 7;
    background:#43a047;
}

/* Yellow */
.yellow-home{
    grid-column:1 / 7;
    grid-row:10 / 16;
    background:#fbc02d;
}

/* Blue */
.blue-home{
    grid-column:10 / 16;
    grid-row:10 / 16;
    background:#1e88e5;
}

/* Token circles */

.token-slot{
    background:white;
    border:2px solid #222;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:
        inset 0 3px 5px rgba(0,0,0,.15),
        0 2px 4px rgba(0,0,0,.2);
}

.token{
    width:65%;
    height:65%;
    border-radius:50%;
    border:2px solid rgba(0,0,0,.35);
}

.red-token{
    background:#d32f2f;
}

.green-token{
    background:#2e7d32;
}

.yellow-token{
    background:#f9a825;
}

.blue-token{
    background:#1565c0;
}

/* PATH CELLS */

.path{
    background:#fff;
}

/* Colored home paths */

.red-path{
    background:#ef5350;
}

.green-path{
    background:#66bb6a;
}

.yellow-path{
    background:#ffee58;
}

.blue-path{
    background:#42a5f5;
}

/* Starting cells */

.start-red{
    background:#d32f2f;
}

.start-green{
    background:#2e7d32;
}

.start-yellow{
    background:#f9a825;
}

.start-blue{
    background:#1565c0;
}

/* SAFE SPOTS */

.safe{
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:clamp(9px,2vw,20px);
}

.safe::after{
    content:"★";
    color:#333;
}

/* CENTER */

.center{
    grid-column:7 / 10;
    grid-row:7 / 10;
    position:relative;
    overflow:hidden;
    background:
        conic-gradient(
            #e53935 0deg 90deg,
            #43a047 90deg 180deg,
            #1e88e5 180deg 270deg,
            #fbc02d 270deg 360deg
        );
    border:2px solid #111;
}

/* White center triangle effect */

.center::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            45deg,
            transparent 49%,
            white 50%,
            transparent 51%
        ),
        linear-gradient(
            -45deg,
            transparent 49%,
            white 50%,
            transparent 51%
        );
}

/* MOBILE */

@media(max-width:500px){

    .ludo-board{
        width:96vw;
        border-width:3px;
    }

    .home{
        padding:10%;
        gap:10%;
    }

    .token{
        width:60%;
        height:60%;
    }
}
</style>
</head>

<body>

<div class="ludo-board">

    <!-- RED HOME -->
    <div class="home red-home">

        <div class="token-slot">
            <div class="token red-token"></div>
        </div>

        <div class="token-slot">
            <div class="token red-token"></div>
        </div>

        <div class="token-slot">
            <div class="token red-token"></div>
        </div>

        <div class="token-slot">
            <div class="token red-token"></div>
        </div>

    </div>


    <!-- GREEN HOME -->
    <div class="home green-home">

        <div class="token-slot">
            <div class="token green-token"></div>
        </div>

        <div class="token-slot">
            <div class="token green-token"></div>
        </div>

        <div class="token-slot">
            <div class="token green-token"></div>
        </div>

        <div class="token-slot">
            <div class="token green-token"></div>
        </div>

    </div>


    <!-- YELLOW HOME -->
    <div class="home yellow-home">

        <div class="token-slot">
            <div class="token yellow-token"></div>
        </div>

        <div class="token-slot">
            <div class="token yellow-token"></div>
        </div>

        <div class="token-slot">
            <div class="token yellow-token"></div>
        </div>

        <div class="token-slot">
            <div class="token yellow-token"></div>
        </div>

    </div>


    <!-- BLUE HOME -->
    <div class="home blue-home">

        <div class="token-slot">
            <div class="token blue-token"></div>
        </div>

        <div class="token-slot">
            <div class="token blue-token"></div>
        </div>

        <div class="token-slot">
            <div class="token blue-token"></div>
        </div>

        <div class="token-slot">
            <div class="token blue-token"></div>
        </div>

    </div>


    <!-- BOARD PATH -->

    <script>

    const board=document.querySelector(".ludo-board");

    /*
        Traditional 15 x 15 Ludo path
    */

    const pathCells=[
        [6,0],[7,0],[8,0],
        [6,1],[8,1],
        [6,2],[8,2],
        [6,3],[8,3],
        [6,4],[8,4],
        [6,5],[7,5],[8,5],

        [9,6],[10,6],[11,6],[12,6],[13,6],[14,6],
        [9,7],[10,7],[11,7],[12,7],[13,7],[14,7],
        [9,8],[10,8],[11,8],[12,8],[13,8],[14,8],

        [8,9],[8,10],[8,11],[8,12],[8,13],[8,14],
        [7,9],[7,10],[7,11],[7,12],[7,13],[7,14],
        [6,9],[6,10],[6,11],[6,12],[6,13],[6,14],

        [5,8],[4,8],[3,8],[2,8],[1,8],[0,8],
        [5,7],[4,7],[3,7],[2,7],[1,7],[0,7],
        [5,6],[4,6],[3,6],[2,6],[1,6],[0,6],

        [6,5],[7,5],[8,5]
    ];

    /*
        Create all empty cells that are not homes
    */

    for(let row=0;row<15;row++){

        for(let col=0;col<15;col++){

            const occupiedHome=
                (row<6 && col<6) ||
                (row<6 && col>8) ||
                (row>8 && col<6) ||
                (row>8 && col>8);

            const center=
                row>=6 && row<=8 &&
                col>=6 && col<=8;

            if(occupiedHome || center) continue;

            const cell=document.createElement("div");

            cell.className="cell path";

            /*
                Colored finishing lanes
            */

            if(col===7 && row>=1 && row<=5)
                cell.classList.add("red-path");

            if(row===7 && col>=9 && col<=13)
                cell.classList.add("green-path");

            if(col===7 && row>=9 && row<=13)
                cell.classList.add("blue-path");

            if(row===7 && col>=1 && col<=5)
                cell.classList.add("yellow-path");

            /*
                Starting squares
            */

            if(row===6 && col===1)
                cell.classList.add("start-red");

            if(row===1 && col===8)
                cell.classList.add("start-green");

            if(row===8 && col===13)
                cell.classList.add("start-blue");

            if(row===13 && col===6)
                cell.classList.add("start-yellow");

            /*
                Safe spots
            */

            const safe=[
                "6,1",
                "1,8",
                "8,13",
                "13,6"
            ];

            if(safe.includes(`${col},${row}`))
                cell.classList.add("safe");

            board.appendChild(cell);
        }
    }


    /*
        CENTER
    */

    const center=document.createElement("div");

    center.className="center";

    board.appendChild(center);

    </script>

</div>

</body>
</html>
