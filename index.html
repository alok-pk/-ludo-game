<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Royal Ludo Offline</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:#071008;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  touch-action:manipulation;
}

/* ---------- START ---------- */

#start{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:18px;
}

.startBox{
  width:min(500px,96vw);
  padding:28px 22px;
  border-radius:28px;
  text-align:center;
  background:
    linear-gradient(145deg,#203c25,#0d160f);
  border:2px solid #d9b82d;
  box-shadow:0 20px 60px #000;
}

.logo{
  width:100px;
  height:100px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:26px;
  font-size:55px;
  background:
    conic-gradient(
      #ef233c 0 25%,
      #27bd55 25% 50%,
      #ffd329 50% 75%,
      #318cf0 75% 100%
    );
  border:6px solid white;
}

h1{
  margin:14px 0 4px;
  font-size:38px;
}

.sub{
  color:#b9c5ba;
  margin-bottom:25px;
}

.label{
  text-align:left;
  color:#ffd43a;
  font-weight:bold;
  margin:15px 0 8px;
}

.players{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.players button,
.startBtn{
  border:0;
  border-radius:13px;
  padding:13px 5px;
  background:#18281b;
  color:white;
  border:1px solid #465647;
  font-weight:bold;
}

.players button.active{
  background:linear-gradient(#ffe665,#f3aa00);
  color:#111;
}

.startBtn{
  width:100%;
  margin-top:24px;
  padding:17px;
  font-size:21px;
  background:linear-gradient(#ffe866,#ffb600);
  color:#111;
}

/* ---------- GAME ---------- */

#game{
  display:none;
  min-height:100vh;
  padding:10px;
}

.header{
  width:min(760px,100%);
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:clamp(24px,6vw,38px);
  font-weight:900;
}

.header button{
  border:1px solid #465647;
  background:#18281b;
  color:#fff;
  border-radius:12px;
  padding:10px 14px;
}

/* ---------- PLAYER CARDS ---------- */

.cards{
  width:min(760px,100%);
  margin:10px auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.card{
  min-height:78px;
  padding:10px;
  border-radius:17px;
  background:#122016;
  border:2px solid #26372a;
}

.card.active{
  border-color:#ffe23c;
  box-shadow:0 0 20px #d5a90055;
}

.name{
  display:flex;
  gap:7px;
  align-items:center;
  font-weight:900;
  font-size:14px;
}

.dot{
  width:13px;
  height:13px;
  border-radius:50%;
}

.red{background:#ef233c}
.green{background:#28bd55}
.yellow{background:#ffd329}
.blue{background:#318cf0}

.cardDice{
  width:46px;
  height:46px;
  margin-top:7px;
  display:grid;
  place-items:center;
  background:#fff;
  color:#111;
  border-radius:11px;
  font-size:28px;
}

/* ---------- BOARD ---------- */

.boardWrap{
  width:min(720px,96vw);
  margin:8px auto;
}

.board{
  position:relative;
  width:100%;
  aspect-ratio:1;
  background:#eadfc5;
  border:9px solid #62391b;
  border-radius:24px;
  box-shadow:
    0 15px 45px #000b,
    inset 0 0 0 3px #f4d889;
  overflow:visible;
}

/* four home boxes */

.home{
  position:absolute;
  width:40%;
  height:40%;
  padding:5%;
  z-index:5;
}

.home.redHome{
  left:0;
  top:0;
  background:#ef233c;
}

.home.greenHome{
  right:0;
  top:0;
  background:#27bd55;
}

.home.blueHome{
  left:0;
  bottom:0;
  background:#318cf0;
}

.home.yellowHome{
  right:0;
  bottom:0;
  background:#ffd329;
}

.homeInner{
  width:100%;
  height:100%;
  border-radius:20px;
  background:#f9f8f1;
  padding:12%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13%;
  box-shadow:inset 0 4px 15px #0002;
}

.base{
  position:relative;
  border-radius:50%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #fff 0%,
      #eeeeee 45%,
      #c5c5c5 100%
    );
  box-shadow:
    inset 0 3px 7px #fff,
    0 4px 8px #0003;
}

/* ---------- TRACK ---------- */

#cells{
  position:absolute;
  inset:0;
  z-index:10;
}

.cell{
  position:absolute;
  width:6.15%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:#fffdf6;
  border:2px solid #aaa28e;
  border-radius:8px;
  display:grid;
  place-items:center;
  box-shadow:0 2px 4px #0002;
}

.cell.star{
  background:#fffef9;
  border-color:#e6c93d;
  box-shadow:0 0 7px #e5c52e88;
}

.cell.star::after{
  content:"★";
  color:#e0bd20;
  font-size:18px;
}

/* coloured starting cells */

.cell.redStart{background:#ffc6ce}
.cell.greenStart{background:#c8f1d2}
.cell.yellowStart{background:#fff0a6}
.cell.blueStart{background:#c9e1ff}

/* home lanes */

.lane{
  position:absolute;
  width:6.15%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:7px;
  z-index:7;
  border:1px solid #777;
}

.lane.redLane{background:#ef233c}
.lane.greenLane{background:#27bd55}
.lane.yellowLane{background:#ffd329}
.lane.blueLane{background:#318cf0}

/* center */

.center{
  position:absolute;
  z-index:30;
  left:35%;
  top:35%;
  width:30%;
  height:30%;
  border:4px solid #827965;
  border-radius:14px;
  overflow:hidden;
  background:#eee6d4;
  box-shadow:0 8px 15px #0003;
}

.center div{
  position:absolute;
  width:50%;
  height:50%;
}

.cRed{
  left:0;
  top:0;
  background:#ef233c;
  clip-path:polygon(0 0,100% 0,100% 100%);
}

.cGreen{
  right:0;
  top:0;
  background:#27bd55;
  clip-path:polygon(0 0,100% 0,0 100%);
}

.cYellow{
  right:0;
  bottom:0;
  background:#ffd329;
  clip-path:polygon(100% 0,100% 100%,0 100%);
}

.cBlue{
  left:0;
  bottom:0;
  background:#318cf0;
  clip-path:polygon(0 0,100% 100%,0 100%);
}

.trophy{
  position:absolute;
  z-index:50;
  inset:0;
  display:grid;
  place-items:center;
  font-size:clamp(25px,7vw,45px);
}

/* ---------- TOKENS ---------- */

.token{
  position:absolute;
  z-index:1000 !important;
  width:7.7%;
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:3px solid #fff;
  display:grid;
  place-items:center;
  color:white;
  font-size:clamp(12px,3vw,20px);
  font-weight:bold;
  cursor:pointer;
  box-shadow:
    0 6px 9px #0008,
    inset 0 4px 6px #ffffff88;
  transition:
    left .22s ease,
    top .22s ease,
    transform .12s ease;
}

.token.movable{
  animation:pulse .7s infinite alternate;
  box-shadow:
    0 0 0 4px #fff,
    0 0 20px #ffe42e,
    0 7px 10px #0008;
}

@keyframes pulse{
  from{transform:translate(-50%,-50%) scale(1)}
  to{transform:translate(-50%,-50%) scale(1.14)}
}

.token.redToken{
  background:radial-gradient(circle at 32% 25%,#ff929d,#ef233c 55%,#a80d20);
}

.token.greenToken{
  background:radial-gradient(circle at 32% 25%,#a5f0b5,#27bd55 55%,#126c2b);
}

.token.yellowToken{
  background:radial-gradient(circle at 32% 25%,#fffcae,#ffd329 55%,#b89200);
}

.token.blueToken{
  background:radial-gradient(circle at 32% 25%,#b2d9ff,#318cf0 55%,#1556a2);
}

/* ---------- CONTROLS ---------- */

.controls{
  width:min(720px,96vw);
  margin:12px auto;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
}

.bigDice{
  width:70px;
  height:70px;
  background:#fff;
  color:#111;
  border-radius:16px;
  display:grid;
  place-items:center;
  font-size:42px;
  box-shadow:0 7px 15px #0005;
}

.roll{
  min-width:210px;
  height:64px;
  border:0;
  border-radius:18px;
  background:linear-gradient(#ffe96c,#ffb700);
  color:#151515;
  font-size:21px;
  font-weight:900;
  box-shadow:0 8px 20px #e0a70055;
}

.roll:disabled{
  opacity:.45;
}

.status{
  text-align:center;
  min-height:30px;
  font-weight:bold;
  font-size:17px;
}

/* ---------- WIN ---------- */

#win{
  display:none;
  position:fixed;
  inset:0;
  z-index:99999;
  background:#000d;
  align-items:center;
  justify-content:center;
}

.winBox{
  width:min(430px,90vw);
  padding:35px 20px;
  text-align:center;
  border-radius:28px;
  background:linear-gradient(145deg,#243d28,#0d160e);
  border:2px solid #ffe14a;
  box-shadow:0 0 60px #ffd52e55;
}

.winEmoji{
  font-size:75px;
}

.winBox h2{
  font-size:34px;
  margin:8px;
}

.restart{
  border:0;
  border-radius:15px;
  padding:15px 30px;
  background:linear-gradient(#ffe55e,#ffb500);
  font-weight:900;
}

/* confetti */

.confetti{
  position:fixed;
  top:-30px;
  z-index:100000;
  font-size:25px;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
  }
}

/* mobile */

@media(max-width:650px){
  #game{padding:6px}

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .card{
    min-height:75px;
  }

  .board{
    border-width:6px;
  }

  .homeInner{
    padding:10%;
  }

  .controls{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<!-- START -->

<section id="start">

  <div class="startBox">

    <div class="logo">🎲</div>

    <h1>ROYAL LUDO</h1>

    <div class="sub">
      Offline • 2–4 Players
    </div>

    <div class="label">
      कितने इंसान खेलेंगे?
    </div>

    <div class="players">

      <button class="playerSelect active" data-count="1">

      </button>

      <button class="playerSelect" data-count="2">

    </button>

</section>


<!-- GAME -->

<section id="game">

  <div class="header">

    <div class="title">
      🎲 ROYAL LUDO
    </div>

    <div>
      <button id="fullBtn">⛶</button>
      <button id="newBtn">नया गेम</button>
    </div>

  </div>


  <div class="cards">

    <div class="card" id="card0">
      <div class="name">

      </div>

      <!-- GREEN HOME -->

      <div class="home greenHome">
        <div class="homeInner">
          <div class="base" id="base-1-0"></div>
          <div class="base" id="base-1-1"></div>
          <div class="base" id="base-1-2"></div>
          <div class="base" id="base-1-3"></div>
        </div>
      </div>

      <!-- BLUE HOME -->

      <div class="home blueHome">
        <div class="homeInner">
          <div class="base" id="base-3-0"></div>
          <div class="base" id="base-3-1"></div>
          <div class="base" id="base-3-2"></div>
          <div class="base" id="base-3-3"></div>
        </div>
      </div>

      <!-- YELLOW HOME -->

      <div class="home yellowHome">
        <div class="homeInner">
          <div class="base" id="base-2-0"></div>
          <div class="base" id="base-2-1"></div>
          <div class="base" id="base-2-2"></div>

      <div id="cells"></div>

      <div class="center">

</section>


<!-- WIN -->

<div id="win">

  <div class="winBox">

    </h2>

    </p>

    <button class="restart" id="restart">
      🔄 फिर खेलें
    </button>

  </div>

</div>


<script>
/* =========================================================
   ROYAL LUDO
   SINGLE FILE JAVASCRIPT
   ========================================================= */

const colors = [
  "red",
  "green",
  "yellow",
  "blue"
];

/*
  बोर्ड का मुख्य 52-cell रास्ता।
  Coordinates 0–14 के grid पर हैं।
*/

const path = [

  [6,0],[7,0],[8,0],
  [9,1],[9,2],[9,3],[9,4],[9,5],
  [10,6],[11,6],[12,6],[13,6],[14,6],
  [14,7],[14,8],
  [13,8],[12,8],[11,8],[10,8],
  [9,9],[9,10],[9,11],[9,12],[9,13],
  [8,14],[7,14],[6,14],
  [5,13],[5,12],[5,11],[5,10],[5,9],
  [4,8],[3,8],[2,8],[1,8],[0,8],
  [0,7],[0,6],
  [1,6],[2,6],[3,6],[4,6],
  [5,5],[5,4],[5,3],[5,2],[5,1]

];

/*
  हर खिलाड़ी का start point।
*/

const starts = [
  0,   // RED
  13,  // GREEN
  26,  // YELLOW
  39   // BLUE
];

/*
  Home lane.
  6 steps के बाद center।
*/

const lanes = {

  red:[
    [6,1],[6,2],[6,3],
    [6,4],[6,5],[7,6]
  ],

  green:[
    [13,6],[12,6],[11,6],
    [10,6],[9,6],[8,7]
  ],

  yellow:[
    [8,13],[8,12],[8,11],
    [8,10],[8,9],[7,8]
  ],

  blue:[
    [1,8],[2,8],[3,8],
    [4,8],[5,8],[6,7]
  ]

};


/* Safe cells */

const safeIndexes = [
  0,8,13,21,26,34,39,47
];


/* State */

let humanCount = 1;

let currentPlayer = 0;

let diceValue = 0;

let waitingForToken = false;

let gameOver = false;

let audioCtx = null;


/*
  प्रत्येक token:

  progress -1 = घर में
  0..51    = main track
  52..57   = home lane
  58       = finished
*/

let players = [];


/* ---------- AUDIO ---------- */

function audio(){

  if(!audioCtx){

    audioCtx =
      new (window.AudioContext ||
           window.webkitAudioContext)();

  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}


function tone(freq,duration=.08,type="sine",volume=.05){

  audio();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}


function diceSound(){

  for(let i=0;i<5;i++){

    setTimeout(()=>{
      tone(
        180 + Math.random()*220,
        .06,
        "square",
        .045
      );
    },i*70);

  }
}


function moveSound(){
  tone(500,.045,"square",.035);
}


function captureSound(){
  tone(120,.16,"sawtooth",.08);

  setTimeout(()=>{
    tone(80,.18,"sawtooth",.06);
  },100);
}


function winSound(){

  [523,659,784,1046].forEach(
    (f,i)=>{
      setTimeout(()=>{
        tone(f,.22,"sine",.08);
      },i*130);
    }
  );

}


/* ---------- UI ---------- */

const startScreen =
  document.getElementById("start");

const gameScreen =
  document.getElementById("game");

const startBtn =
  document.getElementById("startBtn");

const rollBtn =
  document.getElementById("rollBtn");

const bigDice =
  document.getElementById("bigDice");

const status =
  document.getElementById("status");

const cells =
  document.getElementById("cells");

const lanesLayer =
  document.getElementById("lanes");

const tokensLayer =
  document.getElementById("tokens");


/* ---------- DICE ---------- */

const diceFaces = [
  "⚀",
  "⚁",
  "⚂",
  "⚃",
  "⚄",
  "⚅"
];


/* ---------- CREATE TRACK ---------- */

function createTrack(){

  cells.innerHTML = "";

  path.forEach((p,index)=>{

    const el =
      document.createElement("div");

    el.className = "cell";

    el.style.left =
      ((p[0]+.5)/15*100)+"%";

    el.style.top =
      ((p[1]+.5)/15*100)+"%";

    if(safeIndexes.includes(index)){
      el.classList.add("star");
    }

    if(index===starts[0])
      el.classList.add("redStart");

    if(index===starts[1])
      el.classList.add("greenStart");

    if(index===starts[2])
      el.classList.add("yellowStart");

    if(index===starts[3])
      el.classList.add("blueStart");

    cells.appendChild(el);

  });

}


/* ---------- CREATE LANES ---------- */

function createLanes(){

  lanesLayer.innerHTML = "";

  colors.forEach(color=>{

    lanes[color].forEach(p=>{

      const el =
        document.createElement("div");

      el.className =
        "lane "+color+"Lane";

      el.style.left =
        ((p[0]+.5)/15*100)+"%";

      el.style.top =
        ((p[1]+.5)/15*100)+"%";

      lanesLayer.appendChild(el);

    });

  });

}


/* ---------- TOKEN BASE POSITION ---------- */

function basePosition(player,index){

  const baseMap = {

    red:[
      [2.2,2.2],
      [3.0,2.2],
      [2.2,3.0],
      [3.0,3.0]
    ],

    green:[
      [12.0,2.2],
      [12.8,2.2],
      [12.0,3.0],
      [12.8,3.0]
    ],

    yellow:[
      [12.0,12.0],
      [12.8,12.0],
      [12.0,12.8],
      [12.8,12.8]
    ],

    blue:[
      [2.2,12.0],
      [3.0,12.0],
      [2.2,12.8],
      [3.0,12.8]
    ]

  };

  return baseMap[colors[player]][index];
}


/* ---------- TOKEN POSITION ---------- */

function getPosition(player,token){

  const color =
    colors[player];

  if(token.progress < 0){

    const p =
      basePosition(player,token.id);

    return {
      x:p[0],
      y:p[1]
    };

  }


  if(token.progress <= 51){

    const absolute =
      (starts[player] +
       token.progress) % 52;

    const p =
      path[absolute];

    return {
      x:p[0]+.5,
      y:p[1]+.5
    };

  }


  const laneIndex =
    token.progress - 52;

  const p =
    lanes[color][laneIndex];

  return {
    x:p[0]+.5,
    y:p[1]+.5
  };

}


/* ---------- CREATE TOKENS ---------- */

function createTokens(){

  tokensLayer.innerHTML = "";

  players.forEach((player,pi)=>{

    player.tokens.forEach((token,ti)=>{

      const el =
        document.createElement("div");

      el.className =
        "token "+colors[pi]+"Token";

      el.id =
        `token-${pi}-${ti}`;

      el.innerHTML = "●";

      el.dataset.player = pi;
      el.dataset.token = ti;

      el.addEventListener(
        "click",
        tokenClicked
      );

      tokensLayer.appendChild(el);

      renderToken(pi,ti);

    });

  });

}


/* ---------- RENDER TOKEN ---------- */

function renderToken(pi,ti){

  const token =
    players[pi].tokens[ti];

  const el =
    document.getElementById(
      `token-${pi}-${ti}`
    );

  if(!el)return;

  const pos =
    getPosition(pi,token);

  el.style.left =
    ((pos.x)/15*100)+"%";

  el.style.top =
    ((pos.y)/15*100)+"%";

  el.classList.remove("movable");

  if(
    waitingForToken &&
    pi===currentPlayer &&
    canMove(pi,ti)
  ){

    el.classList.add("movable");

  }

}


/* ---------- MOVEMENT RULE ---------- */

function canMove(pi,ti){

  const token =
    players[pi].tokens[ti];

  if(token.progress===58)
    return false;

  if(token.progress<0)
    return diceValue===6;

  return token.progress+diceValue<=57;
}


/* ---------- MOVE TOKEN ---------- */

async function moveToken(pi,ti){

  const token =
    players[pi].tokens[ti];

  if(!canMove(pi,ti))
    return;

  waitingForToken = false;

  clearHighlights();

  /* घर से बाहर */

  if(token.progress<0){

    token.progress=0;

    renderToken(pi,ti);

    moveSound();

    await sleep(280);

  }

  else{

    for(
      let step=0;
      step<diceValue;
      step++
    ){

      token.progress++;

      renderToken(pi,ti);

      moveSound();

      await sleep(150);

    }

  }


  /* finish */

  if(token.progress===57){

    token.progress=58;

    renderToken(pi,ti);

    await sleep(150);

    checkWinner(pi);

    if(gameOver)return;

  }


  /* capture */

  if(
    token.progress>=0 &&
    token.progress<=51
  ){

    capture(pi,ti);

  }


  /* छह आया तो same player */

  if(diceValue===6){

    status.textContent =
      `PLAYER ${pi+1} को फिर मौका`;

    diceValue=0;

    rollBtn.disabled=false;

    updateCards();

    return;

  }


  nextTurn();

}


/* ---------- CAPTURE ---------- */

function capture(pi,ti){

  const token =
    players[pi].tokens[ti];

  if(token.progress<0 ||
     token.progress>51)
    return;

  const absolute =
    (starts[pi]+token.progress)%52;

  if(safeIndexes.includes(absolute))
    return;


  let captured=false;


  players.forEach((player,op)=>{

    if(op===pi)return;

    player.tokens.forEach(other=>{

      if(
        other.progress>=0 &&
        other.progress<=51
      ){

        const otherAbsolute =
          (starts[op]+other.progress)%52;

        if(
          otherAbsolute===absolute
        ){

          other.progress=-1;

          captured=true;

          renderToken(op,other.id);

        }

      }

    });

  });


  if(captured){

    captureSound();

    status.textContent =
      "💥 गोटी काट दी गई!";

  }

}


/* ---------- TOKEN CLICK ---------- */

function tokenClicked(){

  const pi =
    Number(this.dataset.player);

  const ti =
    Number(this.dataset.token);

  if(gameOver)return;

  if(pi!==currentPlayer)return;

  if(!waitingForToken)return;

  if(!canMove(pi,ti))return;

  moveToken(pi,ti);

}


/* ---------- HIGHLIGHT ---------- */

function highlightTokens(){

  players[currentPlayer]
    .tokens
    .forEach((token,ti)=>{

      renderToken(
        currentPlayer,
        ti
      );

    });

}


function clearHighlights(){

  document
    .querySelectorAll(".token")
    .forEach(el=>{
      el.classList.remove("movable");
    });

}


/* ---------- ROLL ---------- */

rollBtn.addEventListener(
  "click",
  rollDice
);


async function rollDice(){

  if(gameOver)return;

  if(waitingForToken)return;

  if(
    players[currentPlayer].ai
  )return;

  audio();

  rollBtn.disabled=true;

  diceSound();

  for(let i=0;i<8;i++){

    const r =
      Math.floor(Math.random()*6)+1;

    bigDice.textContent =
      diceFaces[r-1];

    document.getElementById(
      `dice${currentPlayer}`
    ).textContent =
      diceFaces[r-1];

    await sleep(70);

  }


  diceValue =
    Math.floor(Math.random()*6)+1;

  bigDice.textContent =
    diceFaces[diceValue-1];

  document.getElementById(
    `dice${currentPlayer}`
  ).textContent =
    diceFaces[diceValue-1];


  const movable =
    players[currentPlayer]
      .tokens
      .some((_,ti)=>
        canMove(currentPlayer,ti)
      );


  if(!movable){

    status.textContent =
      `PLAYER ${currentPlayer+1} की कोई चाल नहीं`;

    await sleep(700);

    if(diceValue===6){

      diceValue=0;

      rollBtn.disabled=false;

      return;

    }

    nextTurn();

    return;

  }


  waitingForToken=true;

  highlightTokens();

  status.textContent =
    `PLAYER ${currentPlayer+1} — गोटी चुनें`;

}


/* ---------- NEXT TURN ---------- */

function nextTurn(){

  diceValue=0;

  waitingForToken=false;

  clearHighlights();

  currentPlayer =
    (currentPlayer+1)%4;

  updateCards();

  status.textContent =
    `PLAYER ${currentPlayer+1} की चाल`;

  rollBtn.disabled =
    players[currentPlayer].ai;

  if(players[currentPlayer].ai){

    setTimeout(
      aiTurn,
      750
    );

  }

}


/* ---------- AI ---------- */

async function aiTurn(){

  if(gameOver)return;

  if(!players[currentPlayer].ai)
    return;

  diceSound();

  rollBtn.disabled=true;

  await sleep(500);

  diceValue =
    Math.floor(Math.random()*6)+1;

  bigDice.textContent =
    diceFaces[diceValue-1];

  document.getElementById(
    `dice${currentPlayer}`
  ).textContent =
    diceFaces[diceValue-1];


  const moves =
    players[currentPlayer]
      .tokens
      .map((_,i)=>i)
      .filter(i=>
        canMove(currentPlayer,i)
      );


  if(!moves.length){

    if(diceValue===6){

      diceValue=0;

      setTimeout(
        aiTurn,
        600
      );

    }else{

      nextTurn();

    }

    return;

  }


  /*
    AI priority:
    1. काटने वाली गोटी
    2. 6 पर घर से बाहर
    3. सबसे आगे वाली गोटी
  */

  let chosen =
    moves[0];

  let best=-999999;


  moves.forEach(i=>{

    const t =
      players[currentPlayer].tokens[i];

    let score=0;

    if(t.progress<0)
      score+=30;

    score+=t.progress*2;

    if(diceValue===6)
      score+=20;

    if(t.progress+diceValue===57)
      score+=100;

    if(score>best){

      best=score;
      chosen=i;

    }

  });


  waitingForToken=true;

  await sleep(250);

  await moveToken(
    currentPlayer,
    chosen
  );

}


/* ---------- WIN ---------- */

function checkWinner(pi){

  const finished =
    players[pi]
      .tokens
      .every(t=>
        t.progress===58
      );

  if(!finished)return;

  gameOver=true;

  winSound();

  document.getElementById(
    "winnerText"
  ).textContent =
    `🏆 PLAYER ${pi+1} जीत गया!`;

  document.getElementById(
    "win"
  ).style.display="flex";

  confetti();

}


/* ---------- CONFETTI ---------- */

function confetti(){

  const emojis=[
    "🎉","🎊","✨","⭐","🏆","🎈","💥"
  ];

  for(let i=0;i<80;i++){

    const el =
      document.createElement("div");

    el.className="confetti";

    el.textContent =
      emojis[
        Math.floor(
          Math.random()*emojis.length
        )
      ];

    el.style.left =
      Math.random()*100+"vw";

    el.style.animationDelay =
      Math.random()*1.5+"s";

    document.body.appendChild(el);

    setTimeout(()=>{
      el.remove();
    },4500);

  }

}


/* ---------- UPDATE CARDS ---------- */

function updateCards(){

  for(let i=0;i<4;i++){

    const card =
      document.getElementById(
        `card${i}`
      );

    card.classList.toggle(
      "active",
      i===currentPlayer
    );

    if(
      players[i] &&
      players[i].ai
    ){

      card.querySelector(
        ".name"
      ).innerHTML =
        `<span class="dot ${colors[i]}"></span>AI ${i+1}`;

    }else{

      card.querySelector(
        ".name"
      ).innerHTML =
        `<span class="dot ${colors[i]}"></span>PLAYER ${i+1}`;

    }

  }

}


/* ---------- START GAME ---------- */

document
  .querySelectorAll(".playerSelect")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".playerSelect")
          .forEach(b=>
            b.classList.remove("active")
          );

        btn.classList.add("active");

        humanCount =
          Number(btn.dataset.count);

      }
    );

  });


startBtn.addEventListener(
  "click",
  startGame
);


function startGame(){

  audio();

  startScreen.style.display="none";

  gameScreen.style.display="block";

  gameOver=false;

  currentPlayer=0;

  diceValue=0;

  waitingForToken=false;


  /*
    1 human:
    PLAYER 1 = human
    PLAYER 2–4 = AI

    2 humans:
    PLAYER 1–2 = human

    3 humans:
    PLAYER 1–3 = human

    4 humans:
    सभी human
  */

  players =
    colors.map((color,i)=>({

      color,

      ai:
        i>=humanCount,

      tokens:[
        {id:0,progress:-1},
        {id:1,progress:-1},
        {id:2,progress:-1},
        {id:3,progress:-1}
      ]

    }));


  createTrack();

  createLanes();

  createTokens();

  updateCards();

  bigDice.textContent="⚀";

  status.textContent=
    "PLAYER 1 की चाल";

  rollBtn.disabled=false;

}


/* ---------- NEW GAME ---------- */

document
  .getElementById("newBtn")
  .addEventListener(
    "click",
    ()=>{
      location.reload();
    }
  );


document
  .getElementById("restart")
  .addEventListener(
    "click",
    ()=>{
      location.reload();
    }
  );


/* ---------- FULLSCREEN ---------- */

document
  .getElementById("fullBtn")
  .addEventListener(
    "click",
    async()=>{

      try{

        if(!document.fullscreenElement){

          await document.documentElement
            .requestFullscreen();

        }else{

          await document.exitFullscreen();

        }

      }catch(e){}

    }
  );


/* ---------- UTILITY ---------- */

function sleep(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}


/* ---------- INITIAL BOARD ---------- */

createTrack();

createLanes();

</script>
