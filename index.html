<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#071008">

<title>Royal Ludo - Offline</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -10%,#314b35 0%,#142117 38%,#070b08 100%);
    color:#fff;
}

body{
    min-height:100vh;
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

.hidden{
    display:none!important;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.startBox{
    width:min(560px,96vw);
    padding:30px;
    border-radius:32px;
    background:
        linear-gradient(145deg,
        rgba(35,55,39,.98),
        rgba(8,14,9,.99));
    border:2px solid rgba(255,214,55,.55);
    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.08),
        0 0 45px rgba(255,200,30,.08);
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    margin:auto;
    border-radius:30px;
    background:
        conic-gradient(
            #ef233c 0deg 90deg,
            #27bd50 90deg 180deg,
            #ffd42e 180deg 270deg,
            #318ef3 270deg 360deg
        );
    border:7px solid #fff;
    box-shadow:
        0 12px 30px rgba(0,0,0,.45),
        inset 0 0 20px rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:56px;
}

.startTitle{
    margin-top:16px;
    font-size:42px;
    font-weight:1000;
    letter-spacing:1px;
}

.startSub{
    color:#c7d3c8;
    margin:8px 0 28px;
}

.sectionTitle{
    text-align:left;
    margin:18px 0 9px;
    color:#ffdc45;
    font-weight:900;
}

.playerChoices{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.playerChoice{
    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
    background:#1a291d;
    color:#fff;
    padding:14px 5px;
    font-weight:900;
    cursor:pointer;
}

.playerChoice.active{
    background:linear-gradient(#ffe765,#ffb400);
    color:#111;
    border-color:#fff2a1;
    box-shadow:0 6px 15px rgba(255,190,0,.22);
}

.info{
    margin-top:18px;
    padding:12px;
    border-radius:14px;
    background:rgba(255,255,255,.05);
    color:#cbd7cc;
    font-size:14px;
    line-height:1.5;
}

.startBtn{
    width:100%;
    margin-top:22px;
    border:0;
    border-radius:18px;
    padding:17px;
    font-size:22px;
    font-weight:1000;
    cursor:pointer;
    background:linear-gradient(#ffe865,#ffb600);
    color:#171717;
    box-shadow:0 9px 25px rgba(255,185,0,.25);
}

.startBtn:active{
    transform:scale(.98);
}

/* =========================================================
   GAME
========================================================= */

#gameScreen{
    display:none;
    min-height:100vh;
    min-height:100dvh;
    padding:10px;
}

.gameWrap{
    width:min(1050px,100%);
    margin:auto;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.title{
    font-size:clamp(23px,4vw,38px);
    font-weight:1000;
}

.topButtons{
    display:flex;
    gap:7px;
}

.topBtn{
    border:1px solid rgba(255,255,255,.18);
    background:#17251a;
    color:#fff;
    border-radius:12px;
    padding:10px 13px;
    font-weight:900;
    cursor:pointer;
}

/* =========================================================
   PLAYER CARDS
========================================================= */

.players{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:10px;
}

.playerCard{
    min-height:92px;
    position:relative;
    padding:10px;
    border-radius:17px;
    background:
        linear-gradient(145deg,
        rgba(28,43,31,.97),
        rgba(12,20,14,.97));
    border:2px solid rgba(255,255,255,.08);
    transition:.2s;
}

.playerCard.active{
    border-color:#ffdc42;
    box-shadow:
        0 0 25px rgba(255,210,40,.22),
        inset 0 0 20px rgba(255,210,40,.04);
    transform:translateY(-2px);
}

.playerName{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:14px;
    font-weight:1000;
}

.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    display:inline-block;
    box-shadow:0 2px 4px rgba(0,0,0,.35);
}

.redDot{background:#ef233c}
.greenDot{background:#27bd50}
.yellowDot{background:#ffd42e}
.blueDot{background:#318ef3}

.aiTag{
    position:absolute;
    right:8px;
    top:8px;
    background:#7447f5;
    border-radius:7px;
    padding:4px 7px;
    font-size:10px;
    font-weight:1000;
}

.miniDice{
    width:50px;
    height:50px;
    margin-top:8px;
    border-radius:13px;
    background:#fff;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
}

/* =========================================================
   BOARD
========================================================= */

.boardWrap{
    width:min(720px,100%);
    margin:auto;
}

.board{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border:9px solid #633b1d;
    border-radius:25px;
    background:#efe8d5;
    box-shadow:
        0 20px 50px rgba(0,0,0,.55),
        inset 0 0 0 3px #f5d98b;
    overflow:visible;
}

/* grid overlay */
.grid{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:repeat(15,1fr);
    grid-template-rows:repeat(15,1fr);
    z-index:1;
}

/* =========================================================
   HOMES
========================================================= */

.home{
    position:absolute;
    width:40%;
    height:40%;
    border-radius:18px;
    padding:10px;
    z-index:2;
    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.22),
        0 5px 15px rgba(0,0,0,.15);
}

.home.red{
    left:0;
    top:0;
    background:#ef233c;
}

.home.green{
    right:0;
    top:0;
    background:#27bd50;
}

.home.yellow{
    right:0;
    bottom:0;
    background:#ffd42e;
}

.home.blue{
    left:0;
    bottom:0;
    background:#318ef3;
}

.homeInner{
    width:100%;
    height:100%;
    background:#f9f9f5;
    border-radius:18px;
    padding:13%;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:12%;
    box-shadow:
        inset 0 5px 15px rgba(0,0,0,.08);
}

.yardSpot{
    position:relative;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 28%,
        #fff 0%,
        #e6e6e6 48%,
        #bdbdbd 100%);
    box-shadow:
        inset 0 3px 5px rgba(255,255,255,.9),
        inset 0 -3px 5px rgba(0,0,0,.08),
        0 3px 6px rgba(0,0,0,.18);
}

/* =========================================================
   TRACK CELLS
========================================================= */

.cell{
    position:absolute;
    width:6.66%;
    height:6.66%;
    transform:translate(-50%,-50%);
    border-radius:8px;
    background:#fffdf7;
    border:2px solid #aaa28f;
    z-index:4;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:
        0 2px 3px rgba(0,0,0,.16),
        inset 0 1px rgba(255,255,255,.9);
}

.cell.safe{
    background:#fffdf6;
    border-color:#e3c530;
    box-shadow:
        0 0 8px rgba(255,213,35,.35),
        inset 0 1px #fff;
}

.star{
    font-size:clamp(13px,3vw,25px);
    color:#e3bf18;
    text-shadow:0 1px #fff;
}

/* colored starting cells */
.start-red{background:#ffc2ca}
.start-green{background:#c2f1cd}
.start-yellow{background:#fff0a8}
.start-blue{background:#c8e2ff}

/* =========================================================
   HOME LANES
========================================================= */

.lane{
    position:absolute;
    width:6.66%;
    height:6.66%;
    transform:translate(-50%,-50%);
    border-radius:7px;
    z-index:5;
    border:1px solid rgba(0,0,0,.15);
    box-shadow:
        inset 0 2px rgba(255,255,255,.3),
        0 2px 3px rgba(0,0,0,.12);
}

.lane.red{background:#ef233c}
.lane.green{background:#27bd50}
.lane.yellow{background:#ffd42e}
.lane.blue{background:#318ef3}

/* =========================================================
   CENTER
========================================================= */

.center{
    position:absolute;
    left:40%;
    top:40%;
    width:20%;
    height:20%;
    z-index:15;
    background:#e8e2d2;
    border:3px solid #9d937f;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.18);
}

.triangle{
    position:absolute;
    width:50%;
    height:50%;
}

.triRed{
    left:0;
    top:0;
    background:#ef233c;
    clip-path:polygon(0 0,100% 0,100% 100%);
}

.triGreen{
    right:0;
    top:0;
    background:#27bd50;
    clip-path:polygon(0 0,100% 0,0 100%);
}

.triYellow{
    right:0;
    bottom:0;
    background:#ffd42e;
    clip-path:polygon(0 0,100% 0,100% 100%);
}

.triBlue{
    left:0;
    bottom:0;
    background:#318ef3;
    clip-path:polygon(0 100%,100% 0,100% 100%);
}

.trophy{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;
    font-size:clamp(20px,5vw,38px);
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
}

/* =========================================================
   TOKENS
========================================================= */

.tokenLayer{
    position:absolute;
    inset:0;
    z-index:100;
    pointer-events:none;
}

.token{
    position:absolute;
    width:8.3%;
    aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:3px solid #fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:1000;
    font-size:clamp(12px,3vw,22px);
    cursor:pointer;
    pointer-events:auto;
    user-select:none;

    box-shadow:
        0 6px 10px rgba(0,0,0,.42),
        inset 0 3px 5px rgba(255,255,255,.65),
        inset 0 -4px 6px rgba(0,0,0,.18);

    transition:
        left .18s ease,
        top .18s ease,
        transform .15s ease,
        filter .15s ease;
}

.token:active{
    transform:translate(-50%,-50%) scale(.92);
}

.token.red{
    background:
        radial-gradient(circle at 30% 24%,
        #ffb0b9 0%,
        #f12c43 45%,
        #b80c25 100%);
}

.token.green{
    background:
        radial-gradient(circle at 30% 24%,
        #b5f6c1 0%,
        #29bd53 45%,
        #11712d 100%);
}

.token.yellow{
    background:
        radial-gradient(circle at 30% 24%,
        #fffbc1 0%,
        #ffd52e 45%,
        #c49c00 100%);
}

.token.blue{
    background:
        radial-gradient(circle at 30% 24%,
        #b6dcff 0%,
        #318ef3 45%,
        #1455a7 100%);
}

.token.movable{
    animation:pulse .75s infinite alternate;
    box-shadow:
        0 0 0 4px #fff,
        0 0 22px #ffe33c,
        0 7px 12px rgba(0,0,0,.4);
}

.token.selected{
    box-shadow:
        0 0 0 5px #fff,
        0 0 30px #ffe33c;
}

@keyframes pulse{
    from{
        transform:translate(-50%,-50%) scale(1);
    }
    to{
        transform:translate(-50%,-50%) scale(1.13);
    }
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
    width:min(720px,100%);
    margin:12px auto 0;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

.bigDice{
    width:75px;
    height:75px;
    border-radius:17px;
    background:#fff;
    color:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:46px;
    box-shadow:
        0 7px 15px rgba(0,0,0,.35),
        inset 0 0 8px rgba(0,0,0,.08);
}

.roll{
    min-width:200px;
    min-height:66px;
    border:0;
    border-radius:19px;
    background:linear-gradient(#ffe968,#ffb500);
    color:#161616;
    font-size:22px;
    font-weight:1000;
    cursor:pointer;
    box-shadow:
        0 9px 22px rgba(255,190,0,.25);
}

.roll:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.roll.rolling{
    animation:diceShake .12s infinite alternate;
}

@keyframes diceShake{
    from{transform:rotate(-4deg) scale(1.02)}
    to{transform:rotate(4deg) scale(1.05)}
}

.status{
    text-align:center;
    min-height:27px;
    margin:9px auto 15px;
    font-weight:900;
    color:#f1f4f1;
}

/* =========================================================
   WIN
========================================================= */

#winOverlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.84);
    backdrop-filter:blur(6px);
}

.winBox{
    width:min(470px,92vw);
    padding:34px 24px;
    text-align:center;
    border-radius:30px;
    background:
        linear-gradient(145deg,#273c2b,#0c140e);
    border:2px solid #ffe04b;
    box-shadow:
        0 0 70px rgba(255,210,40,.25);
}

.winEmoji{
    font-size:75px;
}

.winBox h1{
    font-size:38px;
    margin:5px 0;
}

.winBox p{
    color:#d0dad1;
}

.restart{
    margin-top:15px;
    padding:15px 28px;
    border:0;
    border-radius:15px;
    background:linear-gradient(#ffe85f,#ffb500);
    font-weight:1000;
    font-size:18px;
}

/* =========================================================
   CONFETTI
========================================================= */

.confetti{
    position:fixed;
    top:-30px;
    z-index:10000;
    font-size:25px;
    pointer-events:none;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:720px){

    #gameScreen{
        padding:7px;
    }

    .players{
        grid-template-columns:repeat(2,1fr);
    }

    .playerCard{
        min-height:82px;
    }

    .miniDice{
        width:45px;
        height:45px;
        font-size:27px;
    }

    .board{
        border-width:6px;
    }

    .home{
        border-radius:14px;
    }

    .homeInner{
        gap:8%;
    }
}

@media(max-width:430px){

    .startBox{
        padding:22px 16px;
    }

    .startTitle{
        font-size:32px;
    }

    .logo{
        width:100px;
        height:100px;
        font-size:48px;
    }

    .playerChoice{
        padding:11px 3px;
        font-size:13px;
    }

    .roll{
        min-width:175px;
    }

    .bigDice{
        width:66px;
        height:66px;
    }

    .playerName{
        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
START
======================================================= -->

<section id="startScreen">

<div class="startBox">

    <div class="logo">🎲</div>

    <div class="startTitle">ROYAL LUDO</div>

    <div class="startSub">

        <button class="playerChoice" data-players="4">

            <br>
            <small>Humans</small>

</div>

</section>


<!-- =======================================================
GAME
======================================================= -->

<section id="gameScreen">

<div class="gameWrap">

    <div class="topbar">

        </div>

        <div class="topButtons">

        </div>

    </div>


    <div id="players" class="players"></div>


    <div class="boardWrap">

        <div id="board" class="board">

            <!-- HOMES -->

            <div class="home red">
                <div class="homeInner">
                    <div class="yardSpot"></div>

                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>
                </div>
            </div>

            <div class="home green">
                <div class="homeInner">
                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>
                </div>
            </div>

            <div class="home yellow">
                <div class="homeInner">
                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>
                </div>
            </div>

            <div class="home blue">
                <div class="homeInner">
                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>
                    <div class="yardSpot"></div>

            <div class="center">

    <div class="controls">

</section>


<!-- =======================================================
WIN
======================================================= -->

<div id="winOverlay">

    <div class="winBox">

        <div class="winEmoji">

        </div>

        <h1 id="winnerText">

        </h1>

        <p>
            चारों गोटियाँ सुरक्षित घर पहुँच गईं।
        </p>

        <button id="restartBtn" class="restart">
            🔄 फिर से खेलें
        </button>

    </div>

</div>

];


/*
  Starting indexes on common Ludo path.
*/

const START_INDEX = {
    red:0,

/* =========================================================

function initAudio(){

    if(!audioCtx){

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if(AudioContext){
            audioCtx = new AudioContext();
        }

    }

    if(audioCtx && audioCtx.state === "suspended"){
        audioCtx.resume();
    }

}


function tone(
    frequency=500,
    duration=.08,
    type="sine",
    volume=.045
){

    if(!audioCtx) return;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(volume,audioCtx.currentTime);

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime + duration
    );
}

/* =========================================================
   COORDINATES
========================================================= */

function progressToCoord(color,progress){

    if(progress<0){

        return YARD[color][0];

    }


    if(progress<52){

        const start =
            START_INDEX[color];

        const absolute =
            (start + progress) % 52;

        return PATH[absolute];

    }


    const laneIndex =
        progress - 52;

    if(laneIndex>=0 && laneIndex<5){

        return HOME_LANES[color][laneIndex];

    }


    /*
      Final home center.
    */

    return [7,7];

}


/* =========================================================
   TOKEN POSITION
========================================================= */

function coordToPercent(coord){

    return {
        left:
            ((coord[0]+.5)/15*100),

        top:
            ((coord[1]+.5)/15*100)
    };

}


function yardOffset(color,index){

    const positions = YARD[color];

    return positions[index];

}


/* =========================================================
   RENDER TOKENS
========================================================= */

function renderTokens(){

    tokenLayer.innerHTML = "";

    players.forEach((player,pIndex)=>{

        player.tokens.forEach((token,tIndex)=>{

            const el = document.createElement("div");

            el.className =
                "token "+
                player.color;

            el.dataset.player = pIndex;
            el.dataset.token = tIndex;

            /*
              Symbol stays small and clean.
            */

            el.textContent = "●";


            let coord;

            if(token.progress<0){

                const yp =
                    yardOffset(
                        player.color,
                        tIndex
                    );

                el.style.left =
                    yp[0]+"%";

                el.style.top =
                    yp[1]+"%";

            }else{

                coord =
                    progressToCoord(
                        player.color,
                        token.progress
                    );

                const p =
                    coordToPercent(coord);

                el.style.left =
                    p.left+"%";

                el.style.top =
                    p.top+"%";

            }


            /*
              When multiple tokens are on same path cell,
              offset them slightly but keep them stable.
            */

            const same =
                getTokensAtSamePosition(
                    player,
                    token
                );

            if(token.progress>=0 &&
               token.progress<52 &&
               same.length>1){

                const offset =
                    (tIndex -
                    (same.length-1)/2) * 8;

                el.style.marginLeft =
                    offset+"px";

                el.style.marginTop =
                    offset+"px";

            }


            if(
                selectedToken &&
                selectedToken.player===pIndex &&
                selectedToken.token===tIndex
            ){
                el.classList.add("selected");
            }


            if(
                isCurrentPlayerToken(
                    pIndex,
                    token
                ) &&
                diceValue>0 &&
                canMove(token,diceValue)
            ){

                el.classList.add("movable");

            }


            el.addEventListener("click",()=>{

                handleTokenClick(
                    pIndex,
                    tIndex
                );

            });


            tokenLayer.appendChild(el);

        });

    });

}


/* =========================================================
   SAME POSITION
========================================================= */

function getTokensAtSamePosition(player,token){

    if(token.progress<0 || token.progress>=52){
        return [token];
    }

    const absolute =
        (START_INDEX[player.color] +
        token.progress) % 52;

    const list = [];

    players.forEach(p=>{

        p.tokens.forEach(t=>{

            if(
                t.progress>=0 &&
                t.progress<52
            ){

                const a =
                    (START_INDEX[p.color] +
                    t.progress) % 52;

                if(a===absolute){
                    list.push(t);
                }

            }

        });

    });

    return list;

}


/* =========================================================
   MOVE RULE
========================================================= */

function canMove(token,dice){

    if(dice!==6 && token.progress===-1){
        return false;
    }

    if(token.progress===-1){
        return dice===6;
    }

    return token.progress+dice<=56;

}


/* =========================================================
   LEGAL TOKENS
========================================================= */

function legalTokens(playerIndex){

    const player =
        players[playerIndex];

    return player.tokens.filter(
        token=>canMove(token,diceValue)
    );

}

/* =========================================================
   TOKEN CLICK
========================================================= */

function handleTokenClick(
    playerIndex,
    tokenIndex
){

    if(rolling) return;

    if(
        playerIndex!==currentPlayer
    ) return;

    if(
        !players[currentPlayer].human
    ) return;

    if(diceValue===0) return;

    const token =
        players[playerIndex]
        .tokens[tokenIndex];

    if(!canMove(token,diceValue)){

        statusEl.textContent =
            "यह गोटी अभी नहीं चल सकती।";

        return;

    }


    moveToken(
        playerIndex,
        tokenIndex
    );

}


/* =========================================================
   MOVE TOKEN
========================================================= */

async function moveToken(
    playerIndex,
    tokenIndex
){

    const player =
        players[playerIndex];

    const token =
        player.tokens[tokenIndex];

    const roll =
        diceValue;


    selectedToken = {
        player:playerIndex,
        token:tokenIndex
    };


    /*
      Enter from yard on six.
    */

    if(token.progress===-1){

        token.progress=0;

        renderTokens();

        soundMove();

        await wait(260);

    }else{

        for(let step=0;step<roll;step++){

            token.progress++;

            renderTokens();

            soundMove();

            await wait(135);

        }

    }


    /*
      Capture.
    */

    const captured =
        captureOpponents(
            playerIndex,
            token
        );


    if(captured){
        soundCapture();

        statusEl.textContent =
            "💥 गोटी कट गई!";
    }


    /*
      Clear selection.
    */

    selectedToken=null;


    /*
      Winner?
    */

    if(
        player.tokens.every(
            t=>t.progress===56
        )
    ){

        finishGame(player);

        return;

    }


    /*
      Six gives another turn.
    */

    if(roll===6){

        /*
          Three six rule.
        */

        if(sixCount>=3){

            sixCount=0;

            statusEl.textContent =
                "तीन बार 6 — अब अगली चाल।";

            setTimeout(()=>{
                nextTurn(false);
            },800);

            return;

        }


        diceValue=0;

        renderTokens();

        statusEl.textContent =
            player.name+
            " — 6 आया! फिर से पासा फेंकें।";

        rollBtn.disabled =
            !player.human;

        if(!player.human){

            setTimeout(
                aiRoll,
                800
            );

        }

        return;

    }


    nextTurn(false);

}


/* =========================================================
   CAPTURE
========================================================= */

function captureOpponents(
    playerIndex,
    token
){

    if(
        token.progress<0 ||
        token.progress>=52
    ){
        return false;
    }


    const player =
        players[playerIndex];


    const absolute =
        (
            START_INDEX[player.color] +
            token.progress
        ) % 52;


    /*
      Safe cell => no capture.
    */

    if(SAFE.has(absolute)){
        return false;
    }


    let captured=false;


    players.forEach((opponent,index)=>{

        if(index===playerIndex) return;

        opponent.tokens.forEach(enemy=>{

            if(
                enemy.progress>=0 &&
                enemy.progress<52
            ){

                const enemyAbsolute =
                    (
                        START_INDEX[opponent.color] +
                        enemy.progress
                    ) % 52;


                if(
                    enemyAbsolute===
                    absolute
                ){

                    enemy.progress=-1;

                    captured=true;

                }

            }

        });

    });


    if(captured){
        renderTokens();
    }


    return captured;

}


/* =========================================================
   NEXT TURN
========================================================= */

function nextTurn(extra=false){

    diceValue=0;

    selectedToken=null;

    if(!extra){

    }

}

/* =========================================================
   AI
========================================================= */

function aiRoll(){

    if(
        players[currentPlayer].human
    ){
        return;
    }

    if(rolling) return;

    rolling=true;

    rollBtn.disabled=true;

    rollBtn.classList.add("rolling");

    soundDice();

    let count=0;

    const timer=setInterval(()=>{

        const n=
            1+
            Math.floor(
                Math.random()*6
            );

        bigDice.textContent=
            DICE[n-1];

        count++;

        if(count>=9){

            clearInterval(timer);

            const result=
                1+
                Math.floor(
                    Math.random()*6
                );

            rolling=false;

            rollBtn.classList.remove("rolling");

            diceValue=result;

            bigDice.textContent=
                DICE[result-1];

            const mini=
                document.getElementById(
                    "mini-dice-"+currentPlayer
                );

            if(mini){
                mini.textContent=
                    DICE[result-1];
            }


            const legal=
                legalTokens(currentPlayer);


            if(legal.length===0){

                statusEl.textContent=
                    "AI के पास चाल नहीं है।";

                setTimeout(()=>{

                    if(result===6){
                        nextTurn(true);
                    }else{
                        nextTurn(false);
                    }

                },700);

                return;

            }


            setTimeout(
                aiMove,
                550
            );

        }

    },80);

}


function aiMove(){

    const player=
        players[currentPlayer];

    if(player.human) return;


    const legal=
        legalTokens(currentPlayer);

    if(!legal.length){
        nextTurn(diceValue===6);
        return;
    }


    /*
      AI priority:
      1. Token which can capture.
      2. Token nearest home.
      3. Token out of yard.
      4. Random legal.
    */

    let chosen=null;


    /*
      Capture candidate.
    */

    for(const token of legal){

        const target =
            targetProgress(
                token,
                diceValue
            );

        if(
            target>=0 &&
            target<52 &&
            willCapture(
                currentPlayer,
                token,
                diceValue
            )
        ){

            chosen=token;
            break;

        }

    }


    /*
      Home progress.
    */

    if(!chosen){

        chosen =
            [...legal]
            .sort(
                (a,b)=>
                    b.progress-a.progress
            )[0];

    }


    const index=
        player.tokens.indexOf(chosen);


    moveToken(
        currentPlayer,
        index
    );

}


/* =========================================================
   AI HELPERS
========================================================= */

function targetProgress(token,roll){

    if(token.progress===-1){

        return roll===6 ? 0 : -1;

    }

    return token.progress+roll;

}


function willCapture(
    playerIndex,
    token,
    roll
){

    const player=
        players[playerIndex];

    const target=
        targetProgress(token,roll);

    if(
        target<0 ||
        target>=52
    ){
        return false;
    }


    const absolute=
        (
            START_INDEX[player.color]+
            target
        )%52;


    if(SAFE.has(absolute)){
        return false;
    }


    return players.some(
        (opponent,index)=>{

            if(index===playerIndex){
                return false;
            }

            return opponent.tokens.some(
                enemy=>{

                    if(
                        enemy.progress<0 ||
                        enemy.progress>=52
                    ){
                        return false;
                    }

                    const enemyAbsolute=
                        (
                            START_INDEX[opponent.color]+
                            enemy.progress
                        )%52;

                    return enemyAbsolute===absolute;

                }
            );

        }
    );

}

    renderPlayerCards();

    updateCards();

    rollBtn.disabled=false;

    statusEl.textContent=
        players[0].name+
        " की चाल — पासा फेंकें।";

});


/* =========================================================
   FULLSCREEN
========================================================= */

fullscreenBtn.addEventListener("click",async()=>{

    try{

        if(!document.fullscreenElement){

            await document.documentElement.requestFullscreen();

        }else{

            await document.exitFullscreen();

        }

    }catch(e){

        /*
          Some mobile browsers do not allow
          programmatic fullscreen.
        */

    }

});


/* =========================================================
   UTILITY
========================================================= */

function wait(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );

}


/* =========================================================
   INITIAL
========================================================= */

createBoard();

</script>
